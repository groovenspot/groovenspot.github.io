name: Build site pages

# data/*.json(이벤트·타임테이블·사진첩)이 바뀌면 이벤트 고정 페이지·사이트맵을 다시 만든다.
on:
  push:
    branches: [main]
    paths: ["data/**", "src/**"]
  workflow_dispatch:
    inputs:
      all:
        description: "IndexNow: 사이트맵 주소 전부 알리기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        run: node src/build.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Rebuild pages from data"
          git pull --rebase origin main
          git push
      # 🔎 IndexNow: 내용이 바뀐 페이지를 빙·얀덱스·네이버에 바로 알림 (2026-11-19) — 실패해도 빌드는 그대로
      - name: IndexNow
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ]; then node src/indexnow.mjs --all; else node src/indexnow.mjs "${{ github.event.before }}"; fi
