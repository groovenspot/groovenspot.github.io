name: PulseCare

on:
  push:
    paths: ["pulsecare/**", ".github/workflows/pulsecare.yml"]
  pull_request:
    paths: ["pulsecare/**", ".github/workflows/pulsecare.yml"]
  workflow_dispatch:

jobs:
  core:
    name: Core logic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsecare/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew :core:test
