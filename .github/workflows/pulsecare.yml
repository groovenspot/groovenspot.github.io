name: PulseCare

on:
  push:
    paths: ["pulsecare/**", ".github/workflows/pulsecare.yml"]
  pull_request:
    paths: ["pulsecare/**", ".github/workflows/pulsecare.yml"]
  workflow_dispatch:

jobs:
  android:
    name: Core logic, server, phone and watch apps
    runs-on: ubuntu-latest
    # 서버 테스트는 실제 Postgres로 돕니다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulsecare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: pulsecare/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        env:
          PULSECARE_TEST_DB: jdbc:postgresql://localhost:5432/pulsecare_test?user=postgres&password=postgres
        run: ./gradlew :server:test :server:installDist :core:test :mobile:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsecare-debug-apk
          path: |
            pulsecare/android/mobile/build/outputs/apk/debug/mobile-debug.apk
            pulsecare/android/wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 14
