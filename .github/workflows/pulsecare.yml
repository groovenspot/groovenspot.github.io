name: PulseCare

on:
  push:
    paths: ["pulsecare/**", ".github/workflows/pulsecare.yml"]
  pull_request:
    paths: ["pulsecare/**", ".github/workflows/pulsecare.yml"]
  workflow_dispatch:

jobs:
  android:
    name: Core logic + phone and watch apps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsecare/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :core:test :mobile:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsecare-debug-apk
          path: |
            pulsecare/android/mobile/build/outputs/apk/debug/mobile-debug.apk
            pulsecare/android/wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 14
