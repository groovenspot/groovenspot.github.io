name: PulseCare

on:
  push:
    paths: ["pulsecare/**", ".github/workflows/pulsecare.yml"]
  pull_request:
    paths: ["pulsecare/**", ".github/workflows/pulsecare.yml"]
  workflow_dispatch:

jobs:
  android:
    name: Core logic, server, phone and watch apps
    runs-on: ubuntu-latest
    # 서버 테스트는 실제 Postgres로 돕니다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulsecare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: pulsecare/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        env:
          PULSECARE_TEST_DB: jdbc:postgresql://localhost:5432/pulsecare_test?user=postgres&password=postgres
        run: ./gradlew :server:test :server:installDist :core:test :mobile:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsecare-debug-apk
          path: |
            pulsecare/android/mobile/build/outputs/apk/debug/mobile-debug.apk
            pulsecare/android/wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 14

  # 아이폰·애플워치. 맥 없이 GitHub의 macOS 러너에서 빌드하고 테스트합니다.
  ios:
    name: iPhone and Apple Watch
    runs-on: macos-15
    defaults:
      run:
        working-directory: pulsecare/ios
    steps:
      - uses: actions/checkout@v4
      - name: Core logic (same results as Android)
        working-directory: pulsecare/ios/PulseCore
        run: swift test

  # 스토어 업로드용 AAB. Actions에서 "Run workflow"로만 돌고, 업로드 키와 서버·Firebase 값은 저장소 비밀값에서 읽습니다.
  release:
    name: Signed release bundles
    if: github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsecare/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed bundles
        env:
          KEYSTORE_B64: ${{ secrets.PULSECARE_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PULSECARE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PULSECARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PULSECARE_KEY_PASSWORD }}
          SERVER_URL: ${{ secrets.PULSECARE_SERVER_URL }}
          FIREBASE_APP_ID: ${{ secrets.PULSECARE_FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.PULSECARE_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.PULSECARE_FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.PULSECARE_FIREBASE_SENDER_ID }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "PULSECARE_UPLOAD_KEYSTORE_B64 비밀값이 없어요 (pulsecare/store/PLAY_STORE.md 참고)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew :mobile:bundleRelease :wear:bundleRelease \
            -Ppulsecare.versionCode=${{ github.run_number }} \
            -Ppulsecare.signing.storeFile="$RUNNER_TEMP/upload.jks" \
            -Ppulsecare.signing.storePassword="$STORE_PASSWORD" \
            -Ppulsecare.signing.keyAlias="$KEY_ALIAS" \
            -Ppulsecare.signing.keyPassword="$KEY_PASSWORD" \
            -Ppulsecare.serverUrl="$SERVER_URL" \
            -Ppulsecare.firebase.appId="$FIREBASE_APP_ID" \
            -Ppulsecare.firebase.apiKey="$FIREBASE_API_KEY" \
            -Ppulsecare.firebase.projectId="$FIREBASE_PROJECT_ID" \
            -Ppulsecare.firebase.senderId="$FIREBASE_SENDER_ID"
          rm "$RUNNER_TEMP/upload.jks"
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: pulsecare-release-aab
          path: |
            pulsecare/android/mobile/build/outputs/bundle/release/mobile-release.aab
            pulsecare/android/wear/build/outputs/bundle/release/wear-release.aab
          retention-days: 30
