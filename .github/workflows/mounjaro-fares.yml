name: Mounjaro fares

# 마운자로 계산기의 날짜별 교통 요금표(mounjaro/fares.json)를 매일 갱신한다.
# 항공 요금은 저장소 시크릿 TRAVELPAYOUTS_TOKEN 이 있을 때만 받는다.
on:
  schedule:
    - cron: "17 21 * * *" # 매일 06:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mounjaro-fares
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update fares
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: node mounjaro/update-fares.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mounjaro/fares.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "마운자로 교통 요금표 갱신"
          git pull --rebase origin main
          git push
