# 셀러도어(wine-route/) 테스트: 단위·통합 → 빌드 → 브라우저 E2E.
# GitHub 은 저장소 맨 위 .github/workflows 만 읽으므로, wine-route/.github/workflows/ci.yml 과 같은 내용을 여기에 둡니다.
name: CellarDoor CI
on:
  push:
    paths: ["wine-route/**", ".github/workflows/cellardoor-ci.yml"]
  pull_request:
    paths: ["wine-route/**", ".github/workflows/cellardoor-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wine
          POSTGRES_PASSWORD: wine
          POSTGRES_DB: wine
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: wine-route
    env:
      DATABASE_URL: postgresql://wine:wine@localhost:5432/wine?schema=public
      INTEGRATION_DATABASE_URL: postgresql://wine:wine@localhost:5432/wine?schema=public
      SESSION_SECRET: ci-secret-0123456789-0123456789-ab
      ADMIN_EMAILS: admin@example.com
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wine-route/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - name: Unit + integration tests
        run: npm test
      # 브라우저 알림 화면까지 확인하도록 일회용 키를 만듭니다 (빌드 때 공개 키가 화면에 들어갑니다)
      - name: Throwaway VAPID keys
        run: |
          npx web-push generate-vapid-keys --json > /tmp/vapid.json
          echo "NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY=$(node -p "require('/tmp/vapid.json').publicKey")" >> "$GITHUB_ENV"
          echo "WEB_PUSH_PRIVATE_KEY=$(node -p "require('/tmp/vapid.json').privateKey")" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            wine-route/playwright-report
            wine-route/test-results
          retention-days: 7
