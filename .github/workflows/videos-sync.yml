name: Sync YouTube live sets

# 매일 11:17(한국 시간)에 유튜브 채널 GROOVE CLUB BUSAN 의 새 공개 롱폼(GROOVE SESSIONS)을
# data/videos.json(홈 '라이브셋')과 가상 클럽 BGM 목록(club/index.html 의 var TRACKS)에 추가한다.
# 로그인·API 키 없이 공개 페이지만 읽고, 추가만 하며 지우지 않는다. 바로 돌리려면 Actions 탭에서 Run workflow.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read the channel's public long-form list
        run: node tools/videos-fetch.mjs "$RUNNER_TEMP/site_videos.json"
      - name: Add new sets to the site
        run: node tools/videos-sync.mjs "$RUNNER_TEMP/site_videos.json"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json club/index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "유튜브 라이브셋 자동 추가"
          git pull --rebase origin main
          git push
