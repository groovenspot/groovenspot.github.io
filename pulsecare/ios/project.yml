# 아이폰·애플워치 앱 프로젝트. Xcode 프로젝트 파일은 커밋하지 않고 XcodeGen으로 만듭니다:
#   brew install xcodegen && cd pulsecare/ios && xcodegen generate
# 맥이 없어도 GitHub Actions(macOS 러너)가 같은 명령으로 빌드합니다 (.github/workflows/pulsecare.yml).
name: PulseCare
options:
  bundleIdPrefix: com.groovenspot
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 서명 팀은 Apple Developer 가입 후 빌드할 때 넘깁니다 (DEVELOPMENT_TEAM=XXXXXXXXXX).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # 가족·AI 상담 서버 주소. 비우면 가족·상담 화면이 "준비 중"으로 보입니다.
    PULSECARE_SERVER_URL: ""
packages:
  PulseCore:
    path: PulseCore
targets:
  PulseCare:
    type: application
    platform: iOS
    sources:
      - path: PulseCare
    dependencies:
      - package: PulseCore
    info:
      path: PulseCare/Info.plist
      properties:
        CFBundleDisplayName: 펄스케어
        CFBundleDevelopmentRegion: ko
        UILaunchScreen:
          UIColorName: Paper
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: 수면·심박·HRV·걸음 기록을 이 아이폰 안에서 읽어 오늘의 컨디션 점수와 미션을 계산해요. 수치는 서버로 보내지 않아요.
        NSHealthUpdateUsageDescription: 펄스케어는 건강 앱에 기록을 쓰지 않아요.
        UIBackgroundModes: [fetch, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.groovenspot.pulsecare.refresh]
        PulseCareServerURL: $(PULSECARE_SERVER_URL)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: PulseCare/PulseCare.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groovenspot.pulsecare
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true

  PulseCareWatch:
    type: application
    platform: watchOS
    sources:
      - path: PulseCareWatch
    dependencies:
      - package: PulseCore
    info:
      path: PulseCareWatch/Info.plist
      properties:
        CFBundleDisplayName: 펄스케어
        CFBundleDevelopmentRegion: ko
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.groovenspot.pulsecare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groovenspot.pulsecare.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true

schemes:
  PulseCare:
    build:
      targets:
        PulseCare: all
    run:
      config: Debug
  PulseCareWatch:
    build:
      targets:
        PulseCareWatch: all
    run:
      config: Debug
