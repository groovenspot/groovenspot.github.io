<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0909">
<title>GROOVE LOUNGE</title>
<link rel="manifest" href="/lounge/manifest.webmanifest">
<link rel="icon" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<body>
<!-- 그루브 라운지 (손님 SNS) — 틀은 ⑧ C-shell, 화면은 screens/*.js (lounge/SPEC.md 6, 서버 저장소) -->
<div id="app">
  <p id="offline" role="status" hidden></p>
  <header class="lounge-header">
    <a class="shell-brand" href="#/tonight">GROOVE LOUNGE</a>
    <div class="lounge-inboxes">
      <a href="#/alerts" data-lounge-inbox="alerts" aria-label="알림">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 6-2 7-3 8h18c-1-1-3-2-3-8M10 20a2 2 0 0 0 4 0"/></svg>
        <span aria-hidden="true" hidden></span>
      </a>
      <a href="#/dm" data-lounge-inbox="dm" aria-label="메시지">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 3H4a1 1 0 0 0-1 1v17l5-4h12a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1Z"/></svg>
        <span aria-hidden="true" hidden></span>
      </a>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav id="tabbar" aria-label="아래 메뉴"></nav>
</div>
<div id="sheet" hidden></div><div id="toast" role="status" aria-live="polite" hidden></div>
<script src="/lounge/core.js"></script>
<script src="/lounge/screens/auth.js"></script>
<script src="/lounge/screens/me.js"></script>

<script src="/lounge/screens/vote.js"></script>
<script src="/lounge/screens/alerts.js"></script>
<script src="/lounge/screens/rooms.js"></script>
<script src="/lounge/screens/dm.js"></script>
<script src="/lounge/screens/compose.js"></script>
