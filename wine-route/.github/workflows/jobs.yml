# 배포한 사이트의 정기 작업을 호출합니다.
# 저장소 Settings → Secrets에 APP_URL(예: https://cellardoor.kr)과 CRON_SECRET,
# Variables에 JOBS_ENABLED=true를 넣어야 동작합니다.
name: Scheduled jobs
on:
  schedule:
    - cron: "7 * * * *" # 매시 7분: 환율 갱신 (+ 유로·달러 30일 저점 알림)
    - cron: "15 */6 * * *" # 6시간마다: 판매처 가격 수집 (하루 4회)
    - cron: "45 */6 * * *" # 수집 30분 뒤: 찜 알림 (목표가·하락·재입고)
    - cron: "55 0 * * 1" # 월요일 09:55 KST: 무료 회원 주간 묶음
  workflow_dispatch:
    inputs:
      job:
        description: fx | crawl | alerts | digest
        required: true
        default: alerts

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ vars.JOBS_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Pick job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "7 * * * *") echo "job=fx" >> "$GITHUB_OUTPUT" ;;
            "15 */6 * * *") echo "job=crawl" >> "$GITHUB_OUTPUT" ;;
            "45 */6 * * *") echo "job=alerts" >> "$GITHUB_OUTPUT" ;;
            "55 0 * * 1") echo "job=digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Call endpoint
        run: |
          curl -fsS --max-time 290 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/${{ steps.pick.outputs.job }}"
