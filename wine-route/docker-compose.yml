services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine
      POSTGRES_DB: wine
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    # 처음 켤 때 DB 준비에 몇 초 걸립니다. 준비된 뒤에 web 이 마이그레이션을 돌리도록 기다립니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wine:wine@db:5432/wine?schema=public
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
