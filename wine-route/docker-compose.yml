services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine
      POSTGRES_DB: wine
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wine:wine@db:5432/wine?schema=public
    ports: ["3000:3000"]
    depends_on: [db]
volumes:
  pgdata:
