<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>GROOVE STAFF</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
:root {
  --bg: #0a0909; --card: #171414; --card-2: #1f1b1b; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --txt: #f6efeb; --muted: #a59a96; --g: #ff7a1a; --s: #a15bff; --ok: #3ccf91; --warn: #ffb020; --bad: #ff3b5c;
  --body: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--g); outline-offset: 2px; border-radius: 8px; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(10,9,9,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 900; letter-spacing: .08em; font-size: 15px; }
.brand b { color: var(--g); }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.who strong { color: var(--txt); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 6px 2px; font-size: 13px; }
main { width: 100%; max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
h1 { font-size: 22px; line-height: 1.3; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
label { display: grid; gap: 6px; font-weight: 700; font-size: 14px; margin-bottom: 14px; }
input { width: 100%; font: inherit; color: var(--txt); background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
input:focus { outline: none; border-color: var(--g); }
.pin { letter-spacing: .5em; font-size: 20px; text-align: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line-2);
  background: var(--card-2); cursor: pointer; font-weight: 800; }
.btn-hot { background: var(--g); border-color: var(--g); color: #120800; width: 100%; }
.btn:disabled { opacity: .55; cursor: default; }
.msg { min-height: 22px; font-size: 14px; color: var(--bad); margin: 10px 0 0; }
.note { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
.tabs { display: flex; gap: 6px; margin: 0 0 16px; overflow-x: auto; }
.tabs button { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: none; color: var(--muted); font-weight: 800; font-size: 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--g); border-color: var(--g); background: rgba(255,122,26,.12); }
.tabs .n { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--g); color: #120800; font-size: 11px; line-height: 18px; }
.list { display: grid; gap: 10px; }
.item { display: grid; gap: 6px; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; cursor: pointer; }
.item:hover { border-color: var(--line-2); }
.item.unread { border-color: rgba(255,122,26,.55); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chip { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--txt); }
.chip.k-회의 { border-color: var(--g); color: var(--g); }
.chip.k-기획 { border-color: var(--s); color: #c9a3ff; }
.chip.k-규칙 { border-color: var(--ok); color: var(--ok); }
.chip.new { background: var(--g); border-color: var(--g); color: #120800; }
.chip.done { border-color: transparent; color: var(--ok); padding-left: 0; }
.title { font-size: 17px; font-weight: 800; line-height: 1.4; }
.empty { border: 1px dashed var(--line-2); border-radius: 16px; padding: 24px 20px; color: var(--muted); text-align: center; }
.dec { display: grid; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.dec.mine { border-color: rgba(255,122,26,.55); }
.dec .what { font-weight: 700; }
.st { font-weight: 800; }
.st.완료 { color: var(--ok); } .st.대기, .st.진행 { color: var(--warn); } .st.late { color: var(--bad); }
.back { margin-bottom: 14px; }
.doc { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; word-break: keep-all; overflow-wrap: break-word; }
.doc h1 { font-size: 21px; margin: 0 0 8px; }
.doc h2 { font-size: 17px; margin: 26px 0 8px; padding-left: 10px; border-left: 4px solid var(--g); }
.doc h3, .doc h4 { font-size: 15px; margin: 18px 0 6px; color: #ffd9bd; }
.doc p { margin: 6px 0; }
.doc ul, .doc ol { margin: 6px 0; padding-left: 22px; }
.doc li { margin: 4px 0; }
.doc li.lv1 { margin-left: 18px; } .doc li.lv2 { margin-left: 36px; } .doc li.lv3 { margin-left: 54px; }
.tw { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 12px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; }
.doc table.kc td:first-child { white-space: nowrap; }
.doc td, .doc th { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.doc th, .doc tr.hd td { background: rgba(255,255,255,.06); font-weight: 800; white-space: nowrap; }
.doc tr:last-child td { border-bottom: 0; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.load { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">GROOVE <b>STAFF</b></div>
  <div class="who" id="who" hidden><span><strong id="whoName"></strong> <span id="whoTeam"></span></span><button class="link" id="logout" type="button">로그아웃</button></div>
</header>

<main>
  <section id="loginView" hidden>
    <form class="card" id="loginForm" autocomplete="off" novalidate>
      <h1>직원 로그인</h1>
      <p class="sub">이름과 PIN 4자리를 넣어 주세요. 한 번 로그인하면 이 폰에서 30일 동안 유지돼요.</p>
      <label>이름<input id="name" name="name" autocomplete="username" placeholder="예) 진호" maxlength="20" required></label>
      <label>PIN 4자리<input id="pin" class="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" placeholder="••••" required></label>
      <button class="btn btn-hot" id="loginBtn" type="submit">로그인</button>
      <p class="msg" id="loginMsg" role="alert"></p>
      <p class="note">PIN을 모르면 대표님께 물어봐 주세요. 5번 틀리면 30분 동안 잠겨요.</p>
    </form>
  </section>

  <section id="appView" hidden>
    <nav class="tabs" role="tablist" aria-label="스태프 메뉴">
      <button type="button" role="tab" data-tab="notes" aria-selected="true">회의록</button>
      <button type="button" role="tab" data-tab="rules" aria-selected="false">규칙</button>
      <button type="button" role="tab" data-tab="dec" aria-selected="false">결정사항</button>
    </nav>
    <div id="listArea"></div>
  </section>

  <section id="docView" hidden>
    <button class="btn back" id="backBtn" type="button">← 목록</button>
    <p class="meta" id="docMeta"></p>
    <article class="doc" id="docBody"></article>
  </section>

  <p class="load" id="loading" hidden>불러오는 중…</p>
</main>

<script>
(function () {
  'use strict';
  // 그루브 구글 계정의 'GROOVE 직원 API' (Apps Script 웹 앱). 회의 내용은 로그인한 직원에게만 여기서 내려온다.
  var API = 'https://script.google.com/macros/s/AKfycbxIlEiy7MjZnPSgeQuTvim-iXvIbdD2E1a_VG7cbrqRgFxGHCy_zmOqW5QrWwjxTsMkQA/exec';
  var KEY = 'gs_staff';
  var $ = function (id) { return document.getElementById(id); };
  var state = { s: null, data: null, tab: 'notes' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || 'null'); return v && v.token && v.exp > Date.now() ? v : null; } catch (e) { return null; } }
  function save(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) {} }
  function call(body) {
    // text/plain 단순 요청 → 사전 확인 없이 가고, 응답은 CORS 로 읽힌다
    return fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  function busy(on) { $('loading').hidden = !on; }
  function show(view) { ['loginView', 'appView', 'docView'].forEach(function (id) { $(id).hidden = id !== view; }); window.scrollTo(0, 0); }
  function today() { var d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 10); }

  function toLogin(msg) {
    state.s = null; state.data = null; save(null);
    $('who').hidden = true; show('loginView'); busy(false);
    $('loginMsg').textContent = msg || '';
    setTimeout(function () { $('name').focus(); }, 50);
  }

  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = $('name').value.trim(), pin = $('pin').value.replace(/\D/g, '');
    if (!name) { $('loginMsg').textContent = '이름을 넣어 주세요.'; return $('name').focus(); }
    if (pin.length !== 4) { $('loginMsg').textContent = 'PIN 4자리를 넣어 주세요.'; return $('pin').focus(); }
    $('loginBtn').disabled = true; $('loginMsg').textContent = '';
    call({ a: 'login', name: name, pin: pin }).then(function (r) {
      if (r.ok) {
        state.s = { token: r.token, name: r.name, team: r.team, exp: r.exp }; save(state.s);
        $('pin').value = ''; return openApp();
      }
      $('pin').value = '';
      if (r.error === 'locked') $('loginMsg').textContent = 'PIN을 여러 번 틀려서 잠겼어요. ' + (r.minutes || 30) + '분 뒤에 다시 해 주세요.';
      else if (r.error === 'busy') $('loginMsg').textContent = '잠시 후 다시 해 주세요.';
      else $('loginMsg').textContent = '이름이나 PIN이 맞지 않아요.' + (typeof r.left === 'number' ? ' (남은 기회 ' + r.left + '번)' : '');
    }).catch(function () { $('loginMsg').textContent = '연결이 안 돼요. 인터넷을 확인하고 다시 해 주세요.'; })
      .then(function () { $('loginBtn').disabled = false; });
  });

  $('logout').addEventListener('click', function () {
    var t = state.s && state.s.token;
    if (t) call({ a: 'logout', token: t }).catch(function () {});
    toLogin('로그아웃했어요.');
  });

  function openApp() {
    $('whoName').textContent = state.s.name; $('whoTeam').textContent = state.s.team ? '· ' + state.s.team : '';
    $('who').hidden = false; show('appView'); refresh();
  }

  function refresh() {
    busy(true); $('listArea').innerHTML = '';
    return call({ a: 'list', token: state.s.token }).then(function (r) {
      busy(false);
      if (r.error === 'auth') return toLogin('로그인이 끝났어요. 다시 로그인해 주세요.');
      if (!r.ok) { $('listArea').innerHTML = '<p class="empty">목록을 못 불러왔어요. 잠시 후 다시 열어 주세요.</p>'; return; }
      state.data = r; render();
    }).catch(function () { busy(false); $('listArea').innerHTML = '<p class="empty">연결이 안 돼요. 인터넷을 확인해 주세요.</p>'; });
  }

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { state.tab = b.dataset.tab; render(); });
  });

  function render() {
    var d = state.data; if (!d) return;
    var notes = d.notes.filter(function (n) { return n.kind !== '규칙'; }), rules = d.notes.filter(function (n) { return n.kind === '규칙'; });
    var unreadN = notes.filter(function (n) { return !n.read; }).length, unreadR = rules.filter(function (n) { return !n.read; }).length;
    var myOpen = d.decisions.filter(function (x) { return x.mine && x.status !== '완료'; }).length;
    var labels = { notes: ['회의록', unreadN], rules: ['규칙', unreadR], dec: ['결정사항', myOpen] };
    document.querySelectorAll('.tabs button').forEach(function (b) {
      var l = labels[b.dataset.tab];
      b.setAttribute('aria-selected', b.dataset.tab === state.tab ? 'true' : 'false');
      b.innerHTML = esc(l[0]) + (l[1] ? '<span class="n">' + l[1] + '</span>' : '');
    });
    var area = $('listArea');
    if (state.tab === 'dec') return renderDec(area, d);
    var list = state.tab === 'rules' ? rules : notes;
    if (!list.length) { area.innerHTML = '<p class="empty">아직 올라온 문서가 없어요.</p>'; return; }
    area.innerHTML = '<div class="list">' + list.map(function (n) {
      return '<button type="button" class="item' + (n.read ? '' : ' unread') + '" data-id="' + esc(n.id) + '">' +
        '<span class="row"><span class="chip k-' + esc(n.kind) + '">' + esc(n.kind) + '</span>' + esc(n.date) +
        (n.read ? '<span class="chip done">✓ 읽음</span>' : '<span class="chip new">안 읽음</span>') + '</span>' +
        '<span class="title">' + esc(n.title) + '</span>' +
        '<span class="row">읽은 사람 ' + n.readers + ' / ' + n.total + '</span></button>';
    }).join('') + '</div>';
    area.querySelectorAll('.item').forEach(function (b) { b.addEventListener('click', function () { openDoc(b.dataset.id); }); });
  }

  function renderDec(area, d) {
    if (!d.decisions.length) { area.innerHTML = '<p class="empty">아직 정리된 결정사항이 없어요. 회의록이 올라오면 여기에 담당·마감이 나와요.</p>'; return; }
    var t = today();
    var rows = d.decisions.slice().sort(function (a, b) { return (b.mine - a.mine) || String(a.due).localeCompare(String(b.due)); });
    area.innerHTML = '<div class="list">' + rows.map(function (x) {
      var late = x.status !== '완료' && x.due && x.due < t;
      return '<div class="dec' + (x.mine ? ' mine' : '') + '"><span class="what">' + esc(x.what) + '</span>' +
        '<span class="row">담당 ' + esc(x.who || '-') + ' · 마감 ' + esc(x.due || '-') + ' · <span class="st ' + esc(late ? 'late' : x.status) + '">' + esc(late ? '마감 지남' : x.status) + '</span>' +
        (x.mine ? ' · <b>내 일</b>' : '') + '</span></div>';
    }).join('') + '</div>';
  }

  function openDoc(id) {
    busy(true); show('docView'); $('docBody').innerHTML = ''; $('docMeta').textContent = '';
    call({ a: 'note', token: state.s.token, id: id }).then(function (r) {
      busy(false);
      if (r.error === 'auth') return toLogin('로그인이 끝났어요. 다시 로그인해 주세요.');
      if (!r.ok) { $('docBody').innerHTML = '<p>문서를 못 불러왔어요.</p>'; return; }
      $('docMeta').textContent = r.kind + ' · ' + r.date;
      $('docBody').innerHTML = r.html; // 서버가 글자를 모두 이스케이프해서 만든 제목·문단·목록·표만 들어 있다
      // 첫 줄이 짧은 칸으로만 된 표(시간·순서·담당 같은)는 머리줄로 보이게
      $('docBody').querySelectorAll('table').forEach(function (t) {
        if (Array.prototype.every.call(t.rows, function (r) { return r.cells.length < 2 || r.cells[0].textContent.trim().length <= 8; })) t.classList.add('kc');
        var r0 = t.rows[0]; if (!r0 || t.rows.length < 3 || r0.querySelector('th')) return;
        if (Array.prototype.every.call(r0.cells, function (c) { return c.textContent.trim().length <= 10; })) r0.className = 'hd';
      });
      var n = state.data && state.data.notes.filter(function (x) { return x.id === id; })[0];
      if (n && !n.read) { n.read = today(); n.readers += 1; }
    }).catch(function () { busy(false); $('docBody').innerHTML = '<p>연결이 안 돼요. 인터넷을 확인해 주세요.</p>'; });
  }

  $('backBtn').addEventListener('click', function () { show('appView'); render(); });

  state.s = load();
  if (state.s) openApp(); else toLogin('');
})();
</script>
</body>
</html>
