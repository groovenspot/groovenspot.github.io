<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>GROOVE STAFF</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
:root {
  --bg: #0a0909; --card: #171414; --card-2: #1f1b1b; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --txt: #f6efeb; --muted: #a59a96; --g: #ff7a1a; --s: #a15bff; --ok: #3ccf91; --warn: #ffb020; --bad: #ff3b5c;
  --gold: #ffcc4d; --silver: #d6dbe3; --bronze: #e0915a;
  --body: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--g); outline-offset: 2px; border-radius: 8px; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(10,9,9,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 900; letter-spacing: .08em; font-size: 15px; }
.brand b { color: var(--g); }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); min-width: 0; }
.who strong { color: var(--txt); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 6px 2px; font-size: 13px; }
main { width: 100%; max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
h1 { font-size: 22px; line-height: 1.3; margin: 0 0 6px; }
h2.sec { font-size: 15px; margin: 22px 0 10px; color: var(--muted); font-weight: 800; }
h2.sec:first-child { margin-top: 0; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
label { display: grid; gap: 6px; font-weight: 700; font-size: 14px; margin-bottom: 14px; }
input, select { width: 100%; font: inherit; color: var(--txt); background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
input:focus, select:focus { outline: none; border-color: var(--g); }
.pw { position: relative; }
.pw input { padding-right: 64px; }
.pw button { position: absolute; right: 6px; top: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 9px; background: var(--card-2); color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line-2);
  background: var(--card-2); cursor: pointer; font-weight: 800; font-size: 14px; }
.btn-hot { background: var(--g); border-color: var(--g); color: #120800; width: 100%; min-height: 48px; font-size: 16px; }
.btn-ok { border-color: var(--ok); color: var(--ok); }
.btn-bad { border-color: rgba(255,59,92,.6); color: #ff8199; }
.btn-bad.arm { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .55; cursor: default; }
.msg { min-height: 22px; font-size: 14px; color: var(--bad); margin: 10px 0 0; }
.msg.ok { color: var(--ok); }
.note { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 0 0 18px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.seg button { min-height: 42px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 800; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--card-2); color: var(--txt); }
.done-box { border: 1px solid rgba(60,207,145,.45); background: rgba(60,207,145,.08); border-radius: 14px; padding: 14px 16px; margin: 0 0 16px; font-size: 14px; }
.done-box b { color: var(--ok); }
.tabs { display: flex; gap: 6px; margin: 0 0 16px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: none; color: var(--muted); font-weight: 800; font-size: 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--g); border-color: var(--g); background: rgba(255,122,26,.12); }
.tabs .n { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--g); color: #120800; font-size: 11px; line-height: 18px; }
.list { display: grid; gap: 10px; }
.item { display: grid; gap: 6px; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; cursor: pointer; }
.item:hover { border-color: var(--line-2); }
.item.unread { border-color: rgba(255,122,26,.55); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chip { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--txt); white-space: nowrap; }
.chip.k-회의 { border-color: var(--g); color: var(--g); }
.chip.k-기획 { border-color: var(--s); color: #c9a3ff; }
.chip.k-교육 { border-color: var(--ok); color: var(--ok); }
.chip.new { background: var(--g); border-color: var(--g); color: #120800; }
.chip.done { border-color: transparent; color: var(--ok); padding-left: 0; }
.chip.t-운영팀 { border-color: #4da3ff; color: #8cc4ff; }
.chip.t-클로버 { border-color: #2fbf71; color: #7be3a6; }
.chip.t-아룬 { border-color: var(--g); color: #ffad70; }
.chip.t-고트 { border-color: #e6c13a; color: #f2d872; }
.chip.t-DJ팀 { border-color: var(--s); color: #c9a3ff; }
.chip.adm { background: var(--g); border-color: var(--g); color: #120800; }
.chip.lead { background: rgba(161,91,255,.18); border-color: var(--s); color: #d6bcff; }
.title { font-size: 17px; font-weight: 800; line-height: 1.4; }
.empty { border: 1px dashed var(--line-2); border-radius: 16px; padding: 24px 20px; color: var(--muted); text-align: center; margin: 0; }
.dec { display: grid; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.dec.mine { border-color: rgba(255,122,26,.55); }
.dec .what { font-weight: 700; }
.st { font-weight: 800; }
.st.완료 { color: var(--ok); } .st.대기, .st.진행 { color: var(--warn); } .st.late { color: var(--bad); }
/* 게스트 현황 */
.gh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
.gh h1 { margin: 0; }
.gh .range { color: var(--muted); font-size: 14px; }
.wk { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.wk button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-weight: 800; font-size: 13px; cursor: pointer; }
.wk button[aria-selected="true"] { background: var(--card-2); color: var(--txt); }
.sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 14px; }
.sum div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.sum small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
.sum b { font-size: 20px; font-variant-numeric: tabular-nums; }
.sum div.win { border-color: rgba(255,204,77,.7); background: rgba(255,204,77,.07); }
.sum div.win small::after { content: " 👑"; }
.sumcap { color: var(--muted); font-size: 12px; font-weight: 800; margin: 0 0 6px; }
.rk .medal { font-size: 26px; line-height: 1; text-align: center; }
details.all { margin-top: 14px; }
details.all summary { cursor: pointer; color: var(--muted); font-weight: 800; font-size: 14px; padding: 8px 0; }
details.all .list { margin-top: 8px; }
/* 팀 게시판 */
.compose { display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 0 0 16px; }
.compose textarea { width: 100%; min-height: 96px; resize: vertical; font: inherit; color: var(--txt); background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; }
.compose textarea:focus { outline: none; border-color: var(--g); }
.compose .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.compose .cnt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.compose .btn-hot { width: auto; min-height: 44px; font-size: 15px; padding: 0 22px; }
.post { display: grid; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.post.mine { border-color: rgba(255,122,26,.45); }
.post .ph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.post .ph strong { color: var(--txt); font-size: 15px; }
.post .ph .btn { margin-left: auto; min-height: 34px; padding: 0 12px; font-size: 12px; }
.post .tx { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.bteams { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.bteams button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: none; color: var(--muted); font-weight: 800; font-size: 13px; cursor: pointer; }
.bteams button[aria-pressed="true"] { color: var(--g); border-color: var(--g); background: rgba(255,122,26,.12); }
.me-card { border: 1px solid rgba(255,122,26,.55); background: rgba(255,122,26,.08); border-radius: 16px; padding: 14px 16px; margin: 0 0 14px; font-size: 15px; }
.me-card b { color: var(--g); font-size: 18px; }
.rk { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; }
.rk.mine { border-color: rgba(255,122,26,.65); }
.rk .no { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 17px; background: var(--card-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.rk.r1 .no { background: var(--gold); color: #2a1d00; }
.rk.r2 .no { background: var(--silver); color: #1d2129; }
.rk.r3 .no { background: var(--bronze); color: #2a1200; }
.rk .nm { min-width: 0; }
.rk .nm strong { font-size: 16px; margin-right: 6px; }
.rk .tot { text-align: right; font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.rk .tot small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-top: 6px; max-width: 300px; }
.days span { text-align: center; font-size: 11px; line-height: 1.25; padding: 3px 0; border-radius: 6px; background: rgba(255,255,255,.04); color: var(--muted); font-variant-numeric: tabular-nums; }
.days span.on { background: rgba(255,122,26,.18); color: var(--txt); font-weight: 800; }
.days span i { display: block; font-style: normal; font-size: 10px; opacity: .7; }
.how { color: var(--muted); font-size: 13px; margin: 16px 0 0; }
.how code { color: var(--txt); background: var(--card-2); padding: 1px 6px; border-radius: 6px; }
/* 가입 승인 */
.acc { display: grid; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.acc.wait { border-color: rgba(255,176,32,.6); }
.acc .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.acc .hd strong { font-size: 17px; }
.acc .hd a { color: var(--muted); font-size: 14px; text-decoration: none; }
.acc .ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.acc .ctl select { width: auto; min-width: 120px; min-height: 44px; padding: 8px 12px; }
.acc .ctl .btn { min-height: 44px; }
.acc .err { color: var(--bad); font-size: 13px; }
.back { margin-bottom: 14px; }
.doc { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; word-break: keep-all; overflow-wrap: break-word; }
.doc h1 { font-size: 21px; margin: 0 0 8px; }
.doc h2 { font-size: 17px; margin: 26px 0 8px; padding-left: 10px; border-left: 4px solid var(--g); }
.doc h3, .doc h4 { font-size: 15px; margin: 18px 0 6px; color: #ffd9bd; }
.doc p { margin: 6px 0; }
.doc ul, .doc ol { margin: 6px 0; padding-left: 22px; }
.doc li { margin: 4px 0; }
.doc li.lv1 { margin-left: 18px; } .doc li.lv2 { margin-left: 36px; } .doc li.lv3 { margin-left: 54px; }
.tw { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 12px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; }
.doc table.kc td:first-child { white-space: nowrap; }
.doc td, .doc th { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.doc th, .doc tr.hd td { background: rgba(255,255,255,.06); font-weight: 800; white-space: nowrap; }
.doc tr:last-child td { border-bottom: 0; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.load { color: var(--muted); padding: 30px 0; text-align: center; }
@media (max-width: 420px) {
  .card { padding: 18px 16px; }
  .sum { grid-template-columns: repeat(2, 1fr); }
  .rk { grid-template-columns: 38px 1fr auto; gap: 10px; padding: 12px; }
  .rk .no { width: 36px; height: 36px; font-size: 15px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">GROOVE <b>STAFF</b></div>
  <div class="who" id="who" hidden><span><strong id="whoName"></strong> <span id="whoTeam"></span></span><button class="link" id="logout" type="button">로그아웃</button></div>
</header>

<main>
  <section id="loginView" hidden>
    <div class="card">
      <div class="seg" role="tablist" aria-label="로그인 또는 가입 신청">
        <button type="button" role="tab" id="segLogin" aria-selected="true">로그인</button>
        <button type="button" role="tab" id="segJoin" aria-selected="false">가입 신청</button>
      </div>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="done-box" id="joinDone" hidden><b>가입 신청 완료.</b> 팀장님이나 대표님이 승인하면 바로 로그인할 수 있어요.</div>
        <h1>직원 로그인</h1>
        <p class="sub">한 번 로그인하면 이 폰에서 30일 동안 유지돼요.</p>
        <label>이름<input id="lid" name="username" autocomplete="username" placeholder="가입할 때 넣은 이름" maxlength="20" required></label>
        <label>비밀번호<span class="pw"><input id="lpw" name="password" type="password" autocomplete="current-password" maxlength="40" required><button type="button" data-eye="lpw">보기</button></span></label>
        <button class="btn btn-hot" id="loginBtn" type="submit">로그인</button>
        <p class="msg" id="loginMsg" role="alert"></p>
        <p class="note">처음이면 위의 <b>가입 신청</b>을 눌러 주세요. 비밀번호를 5번 틀리면 30분 동안 잠겨요.</p>
      </form>

      <form id="joinForm" autocomplete="on" novalidate hidden>
        <h1>가입 신청</h1>
        <p class="sub">이름·전화번호·팀·비밀번호를 넣으면 우리 팀 팀장님이나 대표님이 확인하고 승인해요. 로그인은 이름 + 비밀번호로 하고, 전화번호는 비상 연락망으로 대표님만 봐요.</p>
        <label>이름<input id="jname" name="name" autocomplete="name" placeholder="예) 홍길동" maxlength="12" required></label>
        <label>전화번호 (비상 연락망)<input id="jphone" name="tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678" maxlength="13" required></label>
        <label>팀<select id="jteam" name="team" required></select></label>
        <label>비밀번호 (6자 이상)<span class="pw"><input id="jpw" name="new-password" type="password" autocomplete="new-password" minlength="6" maxlength="40" required><button type="button" data-eye="jpw">보기</button></span></label>
        <button class="btn btn-hot" id="joinBtn" type="submit">가입 신청</button>
        <p class="msg" id="joinMsg" role="alert"></p>
        <p class="note">같은 이름이 이미 있으면 뒤에 한 글자를 붙여 주세요. 예) 민수B</p>
      </form>
    </div>
  </section>

  <section id="appView" hidden>
    <nav class="tabs" role="tablist" aria-label="스태프 메뉴" id="tabs">
      <button type="button" role="tab" data-tab="guest" aria-selected="true">게스트 현황</button>
      <button type="button" role="tab" data-tab="edu" aria-selected="false">신규 교육</button>
      <button type="button" role="tab" data-tab="board" aria-selected="false" hidden>팀 게시판</button>
      <button type="button" role="tab" data-tab="notes" aria-selected="false" hidden>회의록</button>
      <button type="button" role="tab" data-tab="dec" aria-selected="false" hidden>결정사항</button>
      <button type="button" role="tab" data-tab="acc" aria-selected="false" hidden>가입 승인</button>
    </nav>
    <div id="listArea"></div>
  </section>

  <section id="docView" hidden>
    <button class="btn back" id="backBtn" type="button">← 목록</button>
    <p class="meta" id="docMeta"></p>
    <article class="doc" id="docBody"></article>
  </section>

  <p class="load" id="loading" hidden>불러오는 중…</p>
</main>

<script>
(function () {
  'use strict';
  // 그루브 구글 계정의 'GROOVE 직원 API' (Apps Script 웹 앱). 내용은 대표님이 승인한 직원에게만 여기서 내려온다.
  var API = 'https://script.google.com/macros/s/AKfycbxIlEiy7MjZnPSgeQuTvim-iXvIbdD2E1a_VG7cbrqRgFxGHCy_zmOqW5QrWwjxTsMkQA/exec';
  var KEY = 'gs_staff';
  var TEAMS = ['운영팀', '클로버', '아룬', '고트', 'DJ팀'];
  var SALES = ['클로버', '아룬', '고트']; // 영업팀
  var DOW = ['월', '화', '수', '목', '금', '토', '일'];
  var $ = function (id) { return document.getElementById(id); };
  var state = { s: null, data: null, tab: 'guest', week: 'week', bteam: '', draft: '' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || 'null'); return v && v.token && v.exp > Date.now() ? v : null; } catch (e) { return null; } }
  function save(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) {} }
  function call(body) {
    // text/plain 단순 요청 → 사전 확인 없이 가고, 응답은 CORS 로 읽힌다
    return fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  function busy(on) { $('loading').hidden = !on; }
  function show(view) { ['loginView', 'appView', 'docView'].forEach(function (id) { $(id).hidden = id !== view; }); window.scrollTo(0, 0); }
  function today() { var d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 10); }
  function md(s) { var p = String(s).split('-'); return +p[1] + '/' + +p[2]; }
  function teamChip(t) { return t ? '<span class="chip t-' + esc(t) + '">' + esc(t) + '</span>' : ''; }
  // 운영팀 / 영업팀(클로버·아룬·고트) / DJ팀
  function teamOptions(cur) {
    function o(t) { return '<option value="' + esc(t) + '"' + (cur === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }
    return o('운영팀') + '<optgroup label="영업팀">' + SALES.map(o).join('') + '</optgroup>' + o('DJ팀');
  }
  function fmtPhone(v) {

  }
  var AUTH_OUT = '로그인이 끝났어요. 다시 로그인해 주세요.';

      else if (r.error === 'busy') m.textContent = '잠시 후 다시 해 주세요.';

    }).catch(function () { $('loginMsg').textContent = '연결이 안 돼요. 인터넷을 확인하고 다시 해 주세요.'; })

  $('logout').addEventListener('click', function () {

  // ── 앱 ─────────────────────────────────────────
  function setWho() {

  }
  function openApp() { setWho(); $('who').hidden = false; show('appView'); refresh(); }

  function refresh(keepScroll) {

  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.addEventListener('click', function () { state.tab = b.dataset.tab; render(); if (state.tab === 'board') refresh(true); });
  });

  function render() {
    var d = state.data; if (!d) return;
    var edu = d.notes.filter(function (n) { return n.kind === '교육'; }), notes = d.notes.filter(function (n) { return n.kind !== '교육' && n.kind !== '규칙'; });
    var pending = (d.accounts || []).filter(function (a) { return a.status === '대기'; }).length;
    var labels = {
      guest: ['게스트 현황', 0],
      edu: ['신규 교육', edu.filter(function (n) { return !n.read; }).length],
      board: [d.admin || !d.team ? '팀 게시판' : d.team + ' 게시판', 0],
      notes: ['회의록', notes.filter(function (n) { return !n.read; }).length],
      dec: ['결정사항', d.decisions.filter(function (x) { return x.mine && x.status !== '완료'; }).length],
      acc: ['가입 승인', pending]
    };
    var LEAD_TABS = { notes: 1, dec: 1 }, hasBoard = !!(d.board && d.board.teams && d.board.teams.length), canAcc = !!(d.admin || d.approver);
    if (!labels[state.tab] || (state.tab === 'acc' && !canAcc) || (state.tab === 'board' && !hasBoard)) state.tab = 'guest';

    });
    var area = $('listArea');
    if (state.tab === 'dec') return renderDec(area, d);

        '<span class="row"><span class="chip k-' + esc(n.kind) + '">' + esc(n.kind) + '</span>' + esc(n.date) +

  function renderDec(area, d) {

    var t = today();
    var rows = d.decisions.slice().sort(function (a, b) { return (b.mine - a.mine) || String(a.due).localeCompare(String(b.due)); });
    area.innerHTML = '<div class="list">' + rows.map(function (x) {
      var late = x.status !== '완료' && x.due && x.due < t;
      return '<div class="dec' + (x.mine ? ' mine' : '') + '"><span class="what">' + esc(x.what) + '</span>' +
        '<span class="row">담당 ' + esc(x.who || '-') + ' · 마감 ' + esc(x.due || '-') + ' · <span class="st ' + esc(late ? 'late' : x.status) + '">' + esc(late ? '마감 지남' : x.status) + '</span>' +
        (x.mine ? ' · <b>내 일</b>' : '') + '</span></div>';

  }

  // ── 게스트 현황 (영업일 월~일, 같은 수는 같은 등수) ──
  // 영업팀 클로버·아룬·고트 팀별 합계 + 개인 1·2·3등. 대표는 전체 순위도 펼쳐 볼 수 있다.
  function rankCard(r, ti) {
    var days = r.days.map(function (n, i) {
      return '<span class="' + (n ? 'on' : '') + '"' + (i === ti ? ' style="outline:1px solid var(--g)"' : '') + '><i>' + DOW[i] + '</i>' + (n || '·') + '</span>';
    }).join('');
    var medal = ['', '🥇', '🥈', '🥉'][r.rank];
    return '<div class="rk r' + r.rank + (r.mine ? ' mine' : '') + '">' +
      (medal ? '<span class="medal" aria-label="' + r.rank + '등">' + medal + '</span>' : '<span class="no">' + r.rank + '</span>') +
      '<div class="nm"><strong>' + esc(r.name) + '</strong>' + teamChip(r.team) + (r.mine ? ' <span class="chip new">나</span>' : '') +
      '<div class="days">' + days + '</div></div>' +
      '<div class="tot">' + r.total + '<small>명</small></div></div>';
  }
  function renderGuest(area, d) {
    var g = d.guests || {}, w = g[state.week] || { rows: [], total: 0 };
    var isNow = state.week === 'week', ti = isNow && w.start ? Math.round((Date.parse(g.today) - Date.parse(w.start)) / 864e5) : -1;
    var teamSum = {}; SALES.forEach(function (t) { teamSum[t] = 0; });
    w.rows.forEach(function (r) { if (teamSum[r.team] != null) teamSum[r.team] += r.total; });
    var best = Math.max.apply(null, SALES.map(function (t) { return teamSum[t]; }));
    var me = w.rows.filter(function (r) { return r.mine; })[0];
    var top = w.rows.filter(function (r) { return r.rank <= 3; });
    var h = '<div class="gh"><div><h1>' + (isNow ? '이번 주' : '지난주') + ' 게스트 순위</h1>' +
      (w.start ? '<span class="range">' + md(w.start) + '(월) ~ ' + md(w.end) + '(일) 영업일</span>' : '') + '</div>' +
      '<div class="wk" role="tablist" aria-label="주 선택"><button type="button" data-w="week" aria-selected="' + isNow + '">이번 주</button>' +
      '<button type="button" data-w="prev" aria-selected="' + !isNow + '">지난주</button></div></div>';
    h += '<p class="sumcap">영업팀 팀별 게스트</p><div class="sum"><div><small>전체</small><b>' + w.total + '</b></div>' + SALES.map(function (t) {
      return '<div' + (best > 0 && teamSum[t] === best ? ' class="win"' : '') + '><small>' + esc(t) + '</small><b>' + teamSum[t] + '</b></div>';
    }).join('') + '</div>';
    if (me) h += '<div class="me-card">내 순위 <b>' + me.rank + '위</b> · 게스트 <b>' + me.total + '명</b>' +
      (me.rank > 3 && top.length ? ' · 3위와 ' + (top[top.length - 1].total - me.total) + '명 차이' : me.rank > 1 && w.rows.length ? ' · 1위와 ' + (w.rows[0].total - me.total) + '명 차이' : '') + '</div>';
    if (!w.rows.length) {
      h += '<p class="empty">' + (isNow ? '이번 주 아직 올라온 게스트가 없어요.' : '지난주 기록이 없어요.') + '</p>';
    } else {
      h += '<h2 class="sec">개인 순위 TOP 3</h2><div class="list">' + top.map(function (r) { return rankCard(r, ti); }).join('') + '</div>';
      if (d.admin && w.rows.length > top.length) {
        h += '<details class="all"><summary>전체 순위 보기 (' + w.rows.length + '명, 대표만)</summary><div class="list">' +
          w.rows.map(function (r) { return rankCard(r, ti); }).join('') + '</div></details>';
      }
    }
    h += '<p class="how">인스타 게스트 방에 <code>이름 게스트 5</code>처럼 올리면 매일 아침 9시쯤 반영돼요. 새벽에 올리면 전날 영업분, 같은 날 다시 올리면 마지막 숫자로 고쳐져요. 팀별 합계는 스태프 페이지에 가입한 이름 기준이에요.</p>';

    area.querySelectorAll('[data-w]').forEach(function (b) { b.addEventListener('click', function () { state.week = b.dataset.w; render(); }); });
  }

  // ── 팀 게시판 (자기 팀 글만 보고 쓴다. 대표는 모든 팀) ──
  function renderBoard(area, d) {
    var b = d.board || { teams: [], posts: {} }, teams = b.teams;
    if (teams.indexOf(state.bteam) < 0) state.bteam = teams[0] || '';
    var t = state.bteam, posts = b.posts[t] || [];

    var ta = $('bText'), cnt = $('bCnt'), msg = $('bMsg');

      }).catch(function () { msg.textContent = '연결이 안 돼요. 다시 해 주세요.'; $('bBtn').disabled = false; });

  // ── 가입 승인 (대표: 전체 / 팀장: 자기 팀 신청 승인·거절, 퇴사자 탈퇴) ──
  function renderAcc(area, d) {
    var acc = d.accounts || [], boss = !!d.admin;
    var groups = boss ? [
      ['승인 대기', acc.filter(function (a) { return a.status === '대기'; })],
      ['승인됨', acc.filter(function (a) { return a.status === '승인'; })],
      ['거절 · 중지', acc.filter(function (a) { return a.status === '거절' || a.status === '중지'; })]
    ] : [
      ['승인 대기', acc.filter(function (a) { return a.status === '대기'; })],
      [esc(d.team) + ' 팀원', acc.filter(function (a) { return a.status === '승인'; })]
    ];
    function teamSel(a) {
      return '<select data-team aria-label="' + esc(a.name) + ' 팀"><option value="">팀 선택</option>' + teamOptions(a.team) + '</select>';
    }
    function roleSel(a) {
      return '<select data-role aria-label="' + esc(a.name) + ' 권한">' + ['직원', '팀장'].map(function (r) {
        return '<option' + (a.role === r ? ' selected' : '') + '>' + r + '</option>';
      }).join('') + '</select>';
    }
    var h = '';
    groups.forEach(function (gp, gi) {
      h += '<h2 class="sec">' + gp[0] + ' ' + gp[1].length + '</h2>';
      if (!gp[1].length) { h += '<p class="empty">' + (gi === 0 ? '새 가입 신청이 없어요.' : '없어요.') + '</p>'; return; }
      h += '<div class="list">' + gp[1].map(function (a) {
        var tel = String(a.phone || '').replace(/\D/g, '');
        var ctl;
        if (boss) {
          if (a.self) ctl = teamSel(a) + '<span class="note" style="margin:0">내 계정 · 대표</span>';
          else if (a.status === '대기') ctl = teamSel(a) + roleSel(a) + '<button class="btn btn-ok" data-op="approve">승인</button><button class="btn btn-bad" data-op="reject">거절</button>';
          else if (a.status === '승인') ctl = teamSel(a) + roleSel(a) + '<button class="btn" data-op="stop">중지</button><button class="btn btn-bad" data-op="delete">탈퇴</button>';
          else ctl = teamSel(a) + roleSel(a) + '<button class="btn btn-ok" data-op="approve">다시 승인</button><button class="btn btn-bad" data-op="delete">삭제</button>';
        } else {
          if (a.status === '대기') ctl = '<button class="btn btn-ok" data-op="approve">승인</button><button class="btn btn-bad" data-op="reject">거절</button>';
          else if (a.self) ctl = '<span class="note" style="margin:0">내 계정</span>';
          else if (a.role === '직원') ctl = '<button class="btn btn-bad" data-op="delete">퇴사 · 탈퇴</button>';
          else ctl = '<span class="note" style="margin:0">팀장 계정은 대표님만 바꿀 수 있어요</span>';
        }
        return '<div class="acc' + (a.status === '대기' ? ' wait' : '') + '" data-name="' + esc(a.name) + '">' +
          '<div class="hd"><strong>' + esc(a.name) + '</strong>' + (a.role === '관리자' ? '<span class="chip adm">대표</span>' : a.role === '팀장' ? '<span class="chip lead">팀장</span>' : '') + teamChip(a.team) +
          (tel ? '<a href="tel:' + esc(tel) + '">' + esc(a.phone) + '</a>' : '') + '</div>' +
          '<div class="row">신청 ' + esc(a.at || '-') + (a.status !== '대기' && a.status !== '승인' ? ' · ' + esc(a.status) : '') + '</div>' +
          '<div class="ctl">' + ctl + '</div><div class="err" role="alert"></div></div>';
      }).join('') + '</div>';
    });
    h += boss
      ? '<p class="how">가입할 때 고른 팀이 미리 골라져 있어요. 승인할 때 팀과 권한을 확인해 주세요. <b>직원</b>은 게스트 현황·신규 교육·팀 게시판, <b>팀장</b>은 회의록·결정사항까지 보고 자기 팀 가입 승인·퇴사자 탈퇴도 할 수 있어요. 중지·탈퇴하면 그 사람은 바로 로그아웃돼요. 비밀번호를 잊은 직원은 탈퇴 후 다시 가입 신청하면 돼요.</p>'
      : '<p class="how">' + esc(d.team) + ' 팀으로 가입 신청한 사람만 보여요. 승인하면 직원 권한으로 들어와요. 퇴사한 직원은 <b>퇴사 · 탈퇴</b>를 두 번 누르면 계정이 지워지고 바로 로그아웃돼요. 팀장 지정·중지·전화번호는 대표님만 볼 수 있어요.</p>';
    area.innerHTML = h;

    area.querySelectorAll('.acc').forEach(function (box) {
      var name = box.dataset.name, sel = box.querySelector('[data-team]'), rsel = box.querySelector('[data-role]'), err = box.querySelector('.err');
      function run(op, team, role) {
        err.textContent = '';
        box.querySelectorAll('button,select').forEach(function (x) { x.disabled = true; });
        call({ a: 'admin', token: state.s.token, op: op, name: name, team: team || '', role: role || '' }).then(function (r) {
          if (r.error === 'auth') return toLogin(AUTH_OUT);
          if (!r.ok) {
            err.textContent = { team: '팀을 골라 주세요.', role: '권한을 골라 주세요.', admin: '대표 계정은 바꿀 수 없어요.', self: '내 계정은 바꿀 수 없어요.', notfound: '이미 지워진 계정이에요.', forbidden: boss ? '대표만 할 수 있어요.' : '우리 팀 직원만 처리할 수 있어요. 다른 건 대표님께 말해 주세요.' }[r.error] || '처리가 안 됐어요. 다시 해 주세요.';
            box.querySelectorAll('button,select').forEach(function (x) { x.disabled = false; });
            return;
          }
          refresh(true);
        }).catch(function () {
          err.textContent = '연결이 안 돼요. 다시 해 주세요.';
          box.querySelectorAll('button,select').forEach(function (x) { x.disabled = false; });
        });
      }
      box.querySelectorAll('[data-op]').forEach(function (b) {
        b.addEventListener('click', function () {
          var op = b.dataset.op;
          if (op === 'approve' && sel && !sel.value) { err.textContent = '승인하려면 팀을 먼저 골라 주세요.'; return sel.focus(); }
          if (op === 'delete' || op === 'reject') {
            if (!b.classList.contains('arm')) {
              b.classList.add('arm'); var t0 = b.textContent; b.textContent = '한 번 더 누르면 ' + t0;
              setTimeout(function () { b.classList.remove('arm'); b.textContent = t0; }, 3500);
              return;
            }
          }
          run(op, op === 'approve' && sel ? sel.value : '', op === 'approve' && rsel ? rsel.value : '');
        });
      });
      // 대표: 이미 승인된 사람(또는 나)은 팀·권한만 바꾸면 바로 저장
      var acc0 = (state.data.accounts || []).filter(function (a) { return a.name === name; })[0];
      if (boss && sel && acc0 && acc0.status === '승인') {
        sel.addEventListener('change', function () { if (sel.value) run('team', sel.value); });
        if (rsel) rsel.addEventListener('change', function () { run('role', '', rsel.value); });
      }
    });
  }

  function openDoc(id) {
    busy(true); show('docView'); $('docBody').innerHTML = ''; $('docMeta').textContent = '';
    call({ a: 'note', token: state.s.token, id: id }).then(function (r) {
      busy(false);
      if (r.error === 'auth') return toLogin(AUTH_OUT);
      if (!r.ok) { $('docBody').innerHTML = '<p>문서를 못 불러왔어요.</p>'; return; }
      $('docMeta').textContent = r.kind + ' · ' + r.date;
      $('docBody').innerHTML = r.html; // 서버가 글자를 모두 이스케이프해서 만든 제목·문단·목록·표만 들어 있다
      // 첫 줄이 짧은 칸으로만 된 표(시간·순서·담당 같은)는 머리줄로 보이게
      $('docBody').querySelectorAll('table').forEach(function (t) {
        if (Array.prototype.every.call(t.rows, function (r) { return r.cells.length < 2 || r.cells[0].textContent.trim().length <= 8; })) t.classList.add('kc');
        var r0 = t.rows[0]; if (!r0 || t.rows.length < 3 || r0.querySelector('th')) return;
        if (Array.prototype.every.call(r0.cells, function (c) { return c.textContent.trim().length <= 10; })) r0.className = 'hd';
      });
      var n = state.data && state.data.notes.filter(function (x) { return x.id === id; })[0];
      if (n && !n.read) { n.read = today(); n.readers += 1; }
    }).catch(function () { busy(false); $('docBody').innerHTML = '<p>연결이 안 돼요. 인터넷을 확인해 주세요.</p>'; });
  }

  $('backBtn').addEventListener('click', function () { show('appView'); render(); });

  state.s = load();
  if (state.s) openApp(); else toLogin('');
})();
</script>
</body>
</html>
