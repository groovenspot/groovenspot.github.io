# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: CardioPacer
options:
  bundleIdPrefix: com.groovenspot
  # The UI is written in Korean; without this iOS treats the app as English-only and
  # shows dates and system prompts in English even on Korean devices.
  developmentLanguage: ko
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Team ID (or pick it in Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic

targets:
  # iPhone companion: zone setup, sync to the watch, workout history. Embeds the watch app.
  CardioPacerPhone:
    type: application
    platform: iOS
    sources:
      - path: CardioPacerPhone
        excludes: [PrivacyInfo.xcprivacy]
      - path: CardioPacerPhone/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared
      - SharedApp
    info:
      path: CardioPacerPhone/Info.plist
      properties:
        CFBundleDisplayName: Cardio Pacer
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: 나이와 안정 시 심박수로 Zone 2 범위를 계산하고, Apple Watch에서 마친 운동의 Zone 2 달성률을 보여줍니다.
        NSHealthUpdateUsageDescription: Cardio Pacer는 iPhone에서 건강 데이터를 쓰지 않습니다. 운동 기록은 Apple Watch 앱이 저장합니다.
    entitlements:
      path: CardioPacerPhone/CardioPacerPhone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.groovenspot.cardiopacer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groovenspot.cardiopacer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CardioPacer
      - sdk: HealthKit.framework

  CardioPacer:
    type: application
    platform: watchOS
    sources:
      - path: CardioPacer
        excludes: [PrivacyInfo.xcprivacy]
      - path: CardioPacer/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared
      - SharedApp
    info:
      path: CardioPacer/Info.plist
      properties:
        CFBundleDisplayName: Cardio Pacer
        CFBundleDevelopmentRegion: ko
        WKApplication: true
        # Installs from the watch App Store on its own, or alongside the iPhone app.
        WKCompanionAppBundleIdentifier: com.groovenspot.cardiopacer
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [workout-processing]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: 실시간 심박수로 Zone 2 유지 여부를 안내하고, 나이와 안정 시 심박수로 목표 구간을 계산합니다.
        NSHealthUpdateUsageDescription: 운동 기록을 건강 앱에 저장합니다.
    entitlements:
      path: CardioPacer/CardioPacer.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.groovenspot.cardiopacer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groovenspot.cardiopacer.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CardioPacerComplications
      - sdk: HealthKit.framework

  CardioPacerComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: CardioPacerComplications
        excludes: [PrivacyInfo.xcprivacy]
      - path: CardioPacerComplications/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared
    info:
      path: CardioPacerComplications/Info.plist
      properties:
        CFBundleDisplayName: Cardio Pacer
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CardioPacerComplications/CardioPacerComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.groovenspot.cardiopacer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groovenspot.cardiopacer.watchkitapp.complications

  CardioPacerTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - CardioPacerTests
    dependencies:
      - target: CardioPacer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groovenspot.cardiopacer.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CardioPacerPhone:
    build:
      targets:
        CardioPacerPhone: all
    run:
      config: Debug
  CardioPacer:
    build:
      targets:
        CardioPacer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CardioPacerTests
