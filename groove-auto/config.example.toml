# config.toml 로 복사해서 값을 채운다. config.toml 은 git에 올라가지 않는다.
# 비밀값(텔레그램 봇 토큰, Anthropic API 키)은 여기 말고 환경변수로 둔다.

timezone = "Asia/Seoul"

[paths]
# 실행 기록·SQLite·대시보드가 쌓이는 곳
data_dir = "~/Downloads/groove_edit/groove_auto_data"
# 구글 클라우드 콘솔에서 받은 OAuth 클라이언트 (기존 yt_upload 것을 그대로 써도 된다)
client_secret = "~/Downloads/groove_edit/yt_upload/client_secret.json"
# `python -m groove_auto auth youtube` / `auth gmail` 이 만드는 토큰
youtube_token = "~/Downloads/groove_edit/groove_auto_data/youtube_token.json"
gmail_token = "~/Downloads/groove_edit/groove_auto_data/gmail_token.json"

[youtube]
# 그루브 채널이 아닌 계정(개인 채널 Suger7719 등)으로 인증됐으면 모든 작업이 멈춘다
channel_title = "GROOVE CLUB BUSAN"

[comments]
auto_reply = true
# 이 시간보다 오래된 댓글은 건너뛴다
lookback_hours = 48
model = "claude-opus-5-5"
effort = "medium"
# 답글에 절대 들어가면 안 되는 단어 (DJ 실명 등). 들어가면 올리지 않고 보고만 한다
forbidden_words = []

[shorts]
publish_time = "15:00"
# 같은 곡은 이 일수 안에 다시 올리지 않는다
same_song_gap_days = 3

# DJ 이름 = DJ별 숏츠 재생목록 ID
[shorts.dj_playlists]
# ZET = "PLxxxxxxxxxxxxxxxx"
# KEYNA = "PLxxxxxxxxxxxxxxxx"

[gmail]
# 새 메일이 있을 때만 보고. 쿼리는 Gmail 검색창 문법 그대로
[[gmail.watch]]
name = "메타 앱 심사"
query = "from:(facebookmail.com OR meta.com) (\"App Review\" OR 앱 검수 OR 앱 심사)"

[[gmail.watch]]
name = "유튜브 API 감사"
query = "from:(google.com OR youtube.com) (\"API Services\" OR audit OR 감사) YouTube"

[kakao]
# 보고를 카카오톡 '나에게 보내기'로 받는다. REST API 키는 secrets.env 의 KAKAO_REST_API_KEY
# 카카오 개발자 앱에 이 주소를 Redirect URI 로 등록해야 한다
redirect_uri = "http://localhost:8765/kakao"
# 메시지를 눌렀을 때 열 주소 (앱 설정 > 플랫폼 > Web 에 도메인 등록 필요). 비워 두면 링크 없음
link_url = ""

[telegram]
# 카톡 대신 또는 함께 쓰려면. 봇 토큰은 환경변수 TELEGRAM_BOT_TOKEN
chat_id = ""
