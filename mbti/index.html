<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0808" />
<title>MBTI 시티 타이쿤</title>
<meta name="description" content="골목 포장마차 하나로 시작해 MBTI 16유형 직원을 뽑고 굴려서 네온시티 상권을 장악하는 경영 시뮬레이션 프로토타입." />
<style>
:root{
  --bg:#0b0808;--bg-2:#141010;--card:#171213;--card-2:#211919;--card-3:#2b2121;
  --line:rgba(255,255,255,.09);--txt:#fbf1ec;--muted:#a99a95;
  --orange:#ff7a1a;--orange-2:#ff4d00;--gold:#ffcf7a;--red:#ff3b5c;
  --purple:#a15bff;--teal:#2ec4b6;--blue:#4d8dff;--green:#43d17a;
  --fire:linear-gradient(105deg,#ff4d00 0%,#ff7a1a 50%,#ffcf7a 100%);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  min-height:100%;overscroll-behavior:none}
body{background:radial-gradient(1200px 600px at 50% -10%,#2a1410 0%,var(--bg) 60%) fixed}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom));min-height:100vh}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:800;background:var(--card-2);border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--fire);color:#1a0a00;border:0}
.btn.ghost{background:transparent}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
h1,h2,h3,h4{margin:0}
.up{color:#7dffb0}.dn{color:#ff8fa3}

/* 시작 화면 */
#intro{padding-top:24px}
.logo{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1.05;background:var(--fire);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-story{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;font-size:14px;line-height:1.7;margin:16px 0}
.field{display:block;width:100%;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:16px;outline:none}
.field:focus{border-color:var(--orange)}
.lbl{font-size:13px;font-weight:800;margin:18px 0 8px;display:block}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tcell{padding:10px 2px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:12px;font-weight:800}
.tcell .e{font-size:22px;display:block;margin-bottom:2px}
.tcell.on{border-color:var(--gold);background:#2a1d10}

/* 상단 바 */
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:12px 0 10px;margin:0 -2px}
.hud-top{display:flex;justify-content:space-between;align-items:baseline}
.co{font-weight:900;font-size:17px}
.day{font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:16px}
.kpi span{font-size:11px;color:var(--muted)}
.goal{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px}
.goal .g-t{font-weight:800;font-size:13px;margin-bottom:4px}
.gl{display:flex;justify-content:space-between;gap:6px;margin-top:3px}
.bar{height:6px;background:var(--card-3);border-radius:6px;overflow:hidden;margin-top:3px}
.bar span{display:block;height:100%;border-radius:6px;background:var(--fire)}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(11,8,8,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.tabs-in{max-width:560px;margin:0 auto}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.tab{padding:7px 0;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;position:relative}
.tab .i{font-size:18px;display:block}
.tab.on{color:var(--txt);background:var(--card-2)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--red)}
.page{display:none}.page.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-t{font-size:13px;font-weight:800;color:var(--muted);margin:14px 2px 8px}

/* 매장 */
.store{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.store-h{display:flex;gap:10px;align-items:center}
.store-ic{width:44px;height:44px;border-radius:12px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.store-h h3{font-size:16px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:12px}
.slot{min-height:76px;border-radius:12px;background:var(--bg-2);border:1px dashed rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;text-align:center;font-size:12px}
.slot.f{border-style:solid;border-color:var(--line);background:var(--card-2)}
.slot .e{font-size:22px;line-height:1.1}
.slot .n{font-weight:800;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .ty{font-size:10px;font-weight:800}
.sbar{width:80%;height:4px;background:var(--card-3);border-radius:4px;margin-top:4px;overflow:hidden}
.sbar span{display:block;height:100%}
.compat{margin-top:10px;font-size:12px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card-2);white-space:nowrap}
.chip.good{background:rgba(67,209,122,.14);color:#7dffb0}
.chip.bad{background:rgba(255,59,92,.14);color:#ff8fa3}
.chip.hid{background:rgba(255,207,122,.15);color:var(--gold)}
.store-f{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}

/* 직원 */
.emp{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left;width:100%}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;border:2px solid var(--line)}
.emp .mid{flex:1;min-width:0}
.emp .nm{font-weight:800;font-size:14px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.emp .sub{font-size:11px;color:var(--muted);margin-top:2px}
.gr{font-size:10px;font-weight:900;padding:1px 6px;border-radius:5px}
.gr-N{background:#3a3030;color:#cfc3bf}.gr-R{background:#14304f;color:#8cc2ff}.gr-SR{background:#3a1d55;color:#d4a8ff}.gr-SSR{background:linear-gradient(90deg,#ff4d00,#ffcf7a);color:#1a0a00}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:20px;margin-bottom:6px}
.modal .lead{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 14px}
.ev-ic{font-size:44px;margin-bottom:6px}
.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.65;margin-bottom:12px}
.fx{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:5px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:900;border-bottom:0;font-size:15px;padding-top:9px}
.settle-store{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.notes{font-size:13px;line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.stats6{display:grid;grid-template-columns:38px 1fr 26px;gap:5px 8px;align-items:center;font-size:12px;margin:10px 0}
.stats6 .b{height:6px;background:var(--card-3);border-radius:6px;overflow:hidden}
.stats6 .b span{display:block;height:100%;border-radius:6px;background:var(--orange)}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.5;margin-bottom:8px}
.opt:active{border-color:var(--orange)}
.opt b{display:block;font-size:15px;margin-bottom:2px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--card-3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:40;animation:fade .2s;max-width:90vw;text-align:center}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;font-weight:800}
.dex div.no{opacity:.3;filter:grayscale(1)}
.dex .e{font-size:22px;display:block}
.combo{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:13px}
.orgcard{background:linear-gradient(160deg,#2a1206,#0b0808 60%);border:1px solid rgba(255,122,26,.4);border-radius:22px;padding:22px 18px;text-align:center}
.orgcard .o-t{font-size:12px;letter-spacing:.2em;color:var(--orange);font-weight:800}
.orgcard h3{font-size:24px;margin:6px 0 16px}
.org-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.org-p{width:76px;text-align:center;font-size:11px}
.org-p .av{margin:0 auto 4px;width:52px;height:52px;font-size:28px}
</style>
</head>
<body>

<script>

const RIVALS=[

  {n:'레이',t:'INFP',a:'감성 브랜딩 팝업으로 손님을 뺏어갔다'},

/* 유형별 밈·취향 */

const HIDDEN_TOTAL=Object.values(SPECIAL).filter(s=>s.k==='hidden').length;
function pairInfo(a,b){
  const sp=SPECIAL[pairKey(a,b)];
  if(sp) return sp;
  let v=0;
  if(a===b) v-=3;
  if(a[0]!==b[0]) v+=3;
  if(a[1]===b[1]) v+=4;
  if(a[2]!==b[2]) v+=2;
  v+= a[3]===b[3]?2:-3;
  if(a[0]==='E'&&b[0]==='E'&&a[2]==='T'&&b[2]==='T'&&a[3]==='J'&&b[3]==='J') v-=10;
  return {v,k:v>=8?'good':v<=-4?'bad':'norm'};
}

function fmt(v){
  const neg=v<0;v=Math.abs(Math.round(v));
  let s= v>=10000 ? (v/10000).toFixed(v>=100000?0:1).replace(/\.0$/,'')+'억' : v.toLocaleString()+'만';

function rollGrade(bonus=0){
  const rep=S?S.rep:3;
  const w={N:Math.max(20,60-(rep-3)*12-bonus*40),R:28+bonus*10,SR:10+(rep-3)*8+bonus*22,SSR:2+(rep-3)*3+bonus*8};
  let tot=Object.values(w).reduce((a,b)=>a+Math.max(0,b),0),r=Math.random()*tot;
  for(const g in w){r-=Math.max(0,w[g]);if(r<=0)return g}
  return 'N';
}

function baseStats(t){
  const s={서비스:4,기획:4,실행:4,감각:4,영업:4,멘탈:4};
  if(t[0]==='E'){s.서비스+=2;s.영업+=2}else{s.기획+=2;s.멘탈+=2}
  if(t[1]==='S'){s.실행+=2;s.감각+=2}else{s.기획+=2;s.감각+=1}
  if(t[2]==='T'){s.영업+=1;s.기획+=1}else{s.서비스+=2}
  if(t[3]==='J'){s.실행+=1;s.멘탈+=1}else{s.감각+=1;s.영업+=1}
  return s;
}
function stats(st){
  const s=baseStats(st.type),q=QUIRKS[st.quirk];
  if(q.st) for(const k in q.st) s[k]+=q.st[k];
  const m=GRADES[st.grade].mul*(1+.03*(st.lv-1));
  for(const k in s) s[k]=Math.max(1,Math.round(s[k]*m));
  return s;
}

function teamCompat(team){
  let tot=0;const pairs=[];
  for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){
    const p=pairInfo(team[i].type,team[j].type);
    tot+=p.v;pairs.push({a:team[i],b:team[j],...p});
  }
  return {pct:clamp(tot,-30,50),pairs};
}

function migrate(o){
  const d={lastDayRev:0,taste:{},diary:[],heat:0,heatFlags:{},cardsUsed:0,lastCard:-99,buffs:[],golden:null,flags:{rival:1,syn:1},dq:{},wq:{hire:0,combo:0,profit:0}};

  S=o;if(!S.quest)newQuests(true,true);

function quiz(){
  let i=0,ans='';
  const step=()=>{
    if(i>=QUIZ.length){closeModal();introType=ans;document.querySelectorAll('.tcell').forEach(x=>x.classList.toggle('on',x.dataset.t===ans));$('newBtn').disabled=false;toast(`당신은 ${ans} ${T[ans].em} ${T[ans].nick}!`);return}
    const [q,o,l]=QUIZ[i];
    openModal(`<div class="small muted">Q${i+1} / 4</div><h2 style="margin:6px 0 14px">${q}</h2>`+o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join(''));

function newGame(company,bossType){
  S={v:2,company,bossType,day:1,cash:300,rep:3,totalProfit:0,bestDayRev:0,lastDayRev:0,chapter:0,seq:0,
    staff:[],stores:[],candidates:[],found:{types:[],combos:[]},news:null,nextEvents:null,
    unlocked:['pojang'],stats:{days:0},taste:{},diary:[],heat:0,heatFlags:{},cardsUsed:0,lastCard:-99,buffs:[],
    golden:null,flags:{},quest:null,dq:{},wq:{hire:0,combo:0,profit:0}};
  const boss=makeStaff(bossType,'SR',{boss:true,name:'사장님',stress:0});
  S.staff.push(boss);
  S.stores.push({id:++S.seq,kind:'pojang',district:'univ',interior:0,opened:1});
  boss.storeId=S.stores[0].id;
  // 첫 직원 후보 2명: 궁합 최고(R) vs 능력 최고(SR, 궁합은 별로)
  const others=TYPES.filter(t=>t!==bossType);
  const byCompat=others.map(t=>({t,p:pairInfo(bossType,t)})).filter(x=>x.p.k!=='hidden').sort((x,y)=>y.p.v-x.p.v);
  const compatT=R(byCompat.slice(0,3)).t;
  const key=t=>{const b=baseStats(t);return b.서비스+b.실행};
  const skillT=others.filter(t=>t!==compatT&&pairInfo(bossType,t).v<=2).sort((x,y)=>key(y)-key(x))[0]||others.find(t=>t!==compatT);
  const A=makeStaff(compatT,'R'),B=makeStaff(skillT,'SR');
  const card=(c,label,sub)=>{const st=stats(c),pv=pairInfo(bossType,c.type).v;
    return `<button class="opt" data-first="${c.id}"><div class="row" style="gap:10px">${avatar(c.type)}<div style="flex:1"><b>${label} · ${esc(c.name)} ${c.type} <span class="gr gr-${c.grade}">${c.grade}</span></b>
      서비스 ${st.서비스} · 실행 ${st.실행} · 사장과 궁합 <span class="${pv>0?'up':pv<0?'dn':''}">${pv>0?'+':''}${pv}%</span><br><span class="muted">"${MEME[c.type]}" · ${sub}</span></div></div></button>`};
  modalLock=true;
  openModal(`<div class="row" style="gap:12px;margin-bottom:12px">${avatar(bossType,60)}<div><div class="small muted">사장님 · ${bossType} ${T[bossType].nick}</div><h2 style="margin:2px 0 0">"${MEME[bossType]}"</h2></div></div>

    ${card(A,'💞 궁합 최고','일급 '+fmt(wage(A)))}${card(B,'💪 능력 최고','일급 '+fmt(wage(B)))}`);
  document.querySelectorAll('[data-first]').forEach(b=>b.onclick=()=>{
    const first=+b.dataset.first===A.id?A:B;
    S.staff.push(first);first.storeId=S.stores[0].id;
    S.staff.forEach(x=>discoverType(x.type));
    rollCandidates();
    S.nextEvents=[{id:'jinsang',storeIdx:0}];
    newQuests(true);
    modalLock=false;save();startUI();
    openModal(`<div class="ev-ic">🏮</div><h2>${esc(company)} 개업!</h2>
      <p class="lead">${esc(first.name)}(${first.type}): "${MEME[first.type]}"</p>
      <div class="notes">
      1. <b>매장</b> 탭에서 직원을 배치하고 팀 궁합을 확인해요.<br>
      2. <b>☀️ 영업 시작</b>을 누르면 하루가 흘러가요. 이벤트가 생기면 누가 대응할지 고르세요. 결과는 MBTI마다 달라요.<br>
      3. 채용은 <b>면접</b>으로 지원자의 숨은 MBTI를 추리해요. 맞히면 계약금 할인!<br>
      4. 스트레스 90을 넘기면 <b>흑화</b>해요. 3일 안에 달래지 못하면 떠나요.</div>
      <button class="btn primary" onclick="closeModal()">시작하기</button>`);
  });
}
function newQuests(daily,weekly){

  if(weekly||!S.quest.w){const q=R(WEEKLY);S.quest.w={id:q.id,target:Math.round(Math.max(300,S.lastDayRev*3)/10)*10,reward:80+S.stores.length*60,done:false};S.wq={hire:0,combo:0,profit:0}}

function compatChips(team){
  if(team.length<2) return `<span class="muted">직원이 2명 이상이면 궁합이 계산돼요</span>`;
  const c=teamCompat(team);
  let h=`<span class="chip ${c.pct>0?'good':c.pct<0?'bad':''}">팀 궁합 ${c.pct>0?'+':''}${c.pct}%</span>`;
  for(const p of c.pairs){
    if(p.k==='norm') continue;
    const known=p.k!=='hidden'||S.found.combos.includes(pairKey(p.a.type,p.b.type));
    const label=p.k==='hidden'?(known?`✨ ${p.n}`:'✨ ???'):(p.n||(p.k==='good'?'잘 맞음':'안 맞음'));
    h+=`<span class="chip ${p.k==='hidden'?'hid':p.k}">${p.a.type}+${p.b.type} ${label} ${p.v>0?'+':''}${p.v}</span>`;
  }
  return h;
}

const signFee=c=>wage(c)*5;
const rerollCost=()=>Math.round(20+S.stores.length*15);
const scoutCost=()=>Math.round(120+S.stores.length*60);
function rollCandidates(){
  S.candidates=[];
  const pool=TYPES.slice().sort(()=>Math.random()-.5);
  for(let i=0;i<3;i++){
    const c=makeStaff(pool[i],rollGrade());
    c.hidden=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,hasHR()?1:2).sort();
    c.asked=[];c.guess={};
    S.candidates.push(c);
  }
}
function reroll(){const c=rerollCost();if(S.cash<c)return toast('현금이 부족해요');S.cash-=c;rollCandidates();save();render()}
function askQuestion(c,axis,qi){
  const [q,a0,a1]=INTERVIEW[axis][qi];
  const truth=c.type[axis]===AXES[axis][0]?0:1;
  const r=Math.random();
  const ans=r<.7?[a0,a1][truth]:r<.85?'음… 그건 상황마다 다를 것 같아요.':[a0,a1][1-truth];
  c.asked.push({q,ans});
}
function candModal(id){
  const c=S.candidates.find(x=>x.id===id);if(!c)return;

function doHire(c,fee,ok){

function rollNextEvents(){
  const out=[];
  const n=Math.random()<.55?2:1;
  const used=new Set();
  for(let i=0;i<n;i++){
    const ev=R(EVENTS);
    if(used.has(ev.id)){continue}
    used.add(ev.id);out.push({id:ev.id,storeIdx:Math.floor(Math.random()*99)});
  }
  S.nextEvents=out;
}
function pickEventStore(ev,storeIdx){
  const ok=S.stores.filter(st=>{const team=teamOf(st);const need=ev.need||1;
    if(ev.id==='poach')return team.some(m=>!m.boss);
    if(ev.id==='romance')return team.filter(m=>!m.boss).length>=2;
    return team.length>=need});
  if(!ok.length)return null;
  return ok[storeIdx%ok.length];
}

function runDay(){
  if(!S)return;
  if(!S.staff.some(s=>s.storeId))return toast('매장에 직원을 1명 이상 배치하세요');
  dayFx={};S.stores.forEach(st=>dayFx[st.id]={rev:1,cash:0,rep:0,notes:[]});
  let forcedRival=null;
  if(S.day>=5&&!S.flags.rival&&teamOf(S.stores[0]).some(m=>!m.boss)){
    S.flags.rival=1;forcedRival=RIVALS[0];
    S.nextEvents=[{id:'poach',storeIdx:0,rival:0}];
    S.news={...RIVALS[0],district:S.stores[0].district,until:S.day+6};
  }
  const queue=(S.nextEvents||[]).map(x=>{const ev=EVENTS.find(e=>e.id===x.id);const st=pickEventStore(ev,x.storeIdx);return st?{ev,st,rival:x.rival}:null}).filter(Boolean);
  modalLock=true;
  const next=()=>{if(!queue.length)return settle();const {ev,st,rival}=queue.shift();showEvent(ev,st,next,rival)};
  if(forcedRival){
    openModal(`<div class="ev-ic">🏢</div><h2>길 건너편에 체인점이 생겼다</h2>
      <p class="lead"><b>${forcedRival.n}</b>(${forcedRival.t})의 대형 체인점이 바로 맞은편에 문을 열었다. 이번 주 이 구역 매출 -15%.</p>
      <div class="notes">"${forcedRival.n}: 이 골목은 원래 우리 거였어. 그리고… 당신 직원, 꽤 쓸 만하던데?"</div>
      <button class="btn primary" id="rvOk">계속</button>`);
    $('rvOk').onclick=next;
  } else next();
}
function applyResult(res,h,st){
  const fx=dayFx[st.id],B=KINDS[st.kind].base;
  if(res.rev)fx.rev*=res.rev;
  if(res.cash)fx.cash+=Math.round(res.cash*B);
  if(res.rep)fx.rep+=res.rep;
  if(res.st&&h)addStress(h,res.st,res.st<0);
  if((res.rev||1)>1.05||(res.rep||0)>0)S.dq.good=1;
  const chips=[];
  if(res.rev&&res.rev!==1)chips.push(`<span class="chip ${res.rev>1?'good':'bad'}">오늘 매출 ×${res.rev.toFixed(2)}</span>`);
  if(res.cash)chips.push(`<span class="chip ${res.cash>0?'good':'bad'}">현금 ${res.cash>0?'+':''}${fmt(Math.round(res.cash*B))}</span>`);
  if(res.rep)chips.push(`<span class="chip ${res.rep>0?'good':'bad'}">평판 ${res.rep>0?'+':''}${res.rep.toFixed(2)}</span>`);
  if(res.st&&h)chips.push(`<span class="chip ${res.st<0?'good':'bad'}">${esc(h.name)} 스트레스 ${res.st>0?'+':''}${res.st}</span>`);
  return chips.join('');
}
function showEvent(ev,st,done,rivalIdx){
  const team=teamOf(st),k=KINDS[st.kind];
  const head=`<div class="small muted">${k.e} ${k.n} · ${DISTRICTS[st.district].n}</div><div class="ev-ic">${ev.e}</div><h2>${ev.t}</h2>`;
  const finish=(h,res)=>{
    const chips=applyResult(res,h,st);
    dayFx[st.id].notes.push(`${ev.e} ${ev.t}: ${res.tx}`);
    openModal(`${head}<div class="result">${h&&!ev.auto?`<b>${esc(h.name)} (${h.type})</b> → `:''}${res.tx}<div class="fx">${chips}</div></div><button class="btn primary" id="evOk">계속</button>`);
    $('evOk').onclick=done;
  };
  if(ev.auto){finish(null,ev.r(null,team));return}
  if(ev.opts){ // 라이벌 스카우트
    const target=R(team.filter(m=>!m.boss));const rv=rivalIdx!=null?RIVALS[rivalIdx]:R(RIVALS);
    const raise=wage(target)*5;
    openModal(`${head}<p class="lead"><b>${rv.n}</b>(${rv.t})가 <b>${esc(target.name)}</b>(${target.type} ${target.grade})에게 연봉 2배를 제안했다!</p>
      <button class="opt" data-o="pay"><b>💰 특별 보너스로 붙잡기</b>${fmt(raise)} 지급 · 확실하지만 비싸다</button>
      <button class="opt" data-o="loyal"><b>🤝 의리에 호소하기</b>F 성향이면 잘 통한다…아마도</button>
      <button class="opt" data-o="let"><b>👋 보내 주기</b>앞길을 응원한다</button>`);
    document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      const o=b.dataset.o;let res;
      if(o==='pay'){if(S.cash<raise){toast('현금이 부족해요');return}S.cash-=raise;res={tx:`${target.name}: "역시 사장님!" 남기로 했다.`,st:-15}}
      else if(o==='loyal'){const p=L(target,2,'F')?.85:.3;res=Math.random()<p?{tx:`${target.name}: "${L(target,2,'F')?'사장님을 두고 어떻게 가요…':'…계산해 보니 여기도 나쁘진 않네요.'}" 남기로 했다.`,st:-5}:(quit(target),{tx:`${target.name}: "${L(target,2,'T')?'감정 말고 숫자로 얘기해요. 죄송합니다.':'정말 죄송해요…'}" ${rv.n}의 회사로 떠났다.`})}
      else{quit(target);res={tx:`${target.name}이(가) ${rv.n}의 회사로 떠났다. 언젠가 라이벌로 만날지도.`}}
      finish(o==='let'||!S.staff.includes(target)?null:target,res);
    });
    return;
  }
  openModal(`${head}<p class="lead">${ev.d}</p>`+team.map(m=>`<button class="emp" data-h="${m.id}">${avatar(m.type)}<div class="mid"><div class="nm">${esc(m.name)} ${typeBadge(m.type)}${m.dark?' 🌑':''}</div><div class="sub">${T[m.type].nick} · 스트레스 ${m.stress}</div></div></button>`).join(''));
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const h=staffById(+b.dataset.h);finish(h,ev.r(h,team))});
}
function quit(s){S.staff=S.staff.filter(x=>x!==s)}

function storeRevenue(st,fx){
  const k=KINDS[st.kind],all=teamOf(st);
  const notes=[];
  // 흑화로 결근한 직원 제외
  const team=all.filter(m=>{if(m.dark&&DARK[m.type][1]==='absent'){notes.push(`🌑 ${m.name}(${m.type}) 흑화로 결근`);return false}return true});
  if(!team.length)return {rev:0,team:all,comp:0,eff:0,notes};
  let power=0;
  for(const m of team){const s=stats(m);let p=s[k.keys[0]]+s[k.keys[1]];
    if(QUIRKS[m.quirk].k==='night'&&['pub','bar','club'].includes(st.kind))p*=1.15;
    if(m.stress>=70&&Math.random()<.3){p*=.6;notes.push(`😵 ${m.name} 실수 연발 (스트레스 ${m.stress})`)}
    power+=p}
  let eff=clamp(power/(k.slots*14),.15,2.5);
  if(has(team,'ENTJ')){eff*=1.2;notes.push('👑 ENTJ 지휘: 효율 +20%')}
  const comp=teamCompat(team).pct;
  let m=DISTRICTS[st.district].m[st.kind]*(isWeekend(S.day)?k.wk[1]:k.wk[0]);
  if(DISTRICTS[st.district].weekendDead&&isWeekend(S.day))m*=.5;
  if(S.news&&S.news.until>=S.day&&S.news.district===st.district)m*=.85;
  if(S.golden&&S.golden.day===S.day&&S.golden.district===st.district){m*=2.5;notes.push('⏰ 황금 시간! 손님 폭증')}
  if(buffOn('night')){m*=1.25;notes.push('🌙 심야 무허가 영업 +25%')}
  if(buffOn('blackout'))m*=1.15;
  m*=.6+S.rep*.12;
  m*=1+st.interior*.08*(has(team,'ISFP')?2:1);
  if(has(team,'ESTJ')){m*=1.1;notes.push('📊 ESTJ 일정 통제: +10%')}
  if(has(team,'ESFJ'))m*=1.08;
  if(has(team,'ENFP')&&Math.random()<.15){m*=1.5;notes.push('🎉 ENFP 텐션 점화! 손님 +50%')}
  if(has(team,'ESFP'))m*=['bar','club'].includes(st.kind)?1.5:1.1;
  if(st.kind==='conv')m*=1+.06*team.filter(x=>x.type[3]==='J').length;
  if(st.kind==='club')m*=1+.06*team.filter(x=>x.type[0]==='E').length;
  for(const d of team.filter(x=>x.dark&&DARK[x.type][1]==='block')){m*=.7;notes.push(`🌑 ${d.name}(${d.type}) 흑화: ${DARK[d.type][0]}`)}
  const noise=has(team,'INTJ')?1.05:.9+Math.random()*.2;
  const rev=Math.round(k.base*eff*(1+comp/100)*m*fx.rev*noise);
  return {rev,team:all,comp,eff,notes};
}
function settle(){
  const day=S.day;
  const rows=[];let totRev=0,totProfit=0;
  const msgs=[];
  for(const st of S.stores){
    const fx=dayFx[st.id],k=KINDS[st.kind];
    const r=storeRevenue(st,fx);
    if(!S.flags.syn&&r.comp>=12&&r.rev>0){S.flags.syn=1;r.rev*=2;r.notes.unshift(`💥 <b style="color:var(--gold)">첫 궁합 시너지 발동! 오늘 매출 2배</b>`)}
    const nT=r.team.filter(m=>m.type[2]==='T').length;
    const cogs=Math.round(r.rev*Math.max(.2,k.cr-.01*nT)*(buffOn('books')?.75:1));
    const wages=Math.round(r.team.reduce((a,m)=>a+wage(m),0)*(buffOn('slave')?.7:1));
    const rent=rentOf(st);
    const profit=r.rev-cogs-wages-rent+fx.cash;
    totRev+=r.rev;totProfit+=profit;
    rows.push({st,r,cogs,wages,rent,profit,fx});
    // 평판 변화
    if(r.team.length){
      const svc=r.team.reduce((a,m)=>a+stats(m).서비스,0)/r.team.length;
      let dr=(svc-10)*.004+fx.rep-(S.rep-3)*.015;
      if(has(r.team,'INFP'))dr+=.03;
      S.rep=clamp(S.rep+dr/Math.max(1,S.stores.length*.6),1,5);
    }
  }
  const idle=S.staff.filter(s=>!s.storeId);
  const idleW=idle.reduce((a,s)=>a+wage(s),0);
  totProfit-=idleW;

  // 흑화 효과 (현금·팀·평판)
  for(const m of S.staff.filter(x=>x.dark)){
    const [txt,kind]=DARK[m.type];const st=m.storeId?storeById(m.storeId):null;
    if(kind==='cash'){const c=10+wage(m)*4;totProfit-=c;msgs.push(`🌑 ${m.name}(${m.type}) ${txt} -${fmt(c)}`)}
    if(kind==='gamble'){const win=Math.random()<.4,c=wage(m)*(win?5:8);totProfit+=win?c:-c;msgs.push(`🌑 ${m.name}(${m.type}) ${txt} → ${win?'땄다?! +':'날렸다 -'}${fmt(c)}`)}
    if(kind==='team'&&st){teamOf(st).forEach(o=>o!==m&&addStress(o,8));msgs.push(`🌑 ${m.name}(${m.type}) ${txt}. 동료 스트레스 +8`)}
    if(kind==='rep'){S.rep=clamp(S.rep-.08,1,5);msgs.push(`🌑 ${m.name}(${m.type}) ${txt}. 평판 -0.08`)}
  }
  S.cash+=totProfit;S.totalProfit+=Math.max(0,totProfit);
  S.bestDayRev=Math.max(S.bestDayRev,totRev);S.lastDayRev=totRev;
  S.wq.profit+=totProfit;

  // 스트레스·성장
  for(const st of S.stores){
    const team=teamOf(st);
    for(const m of team){
      let d=6;
      if(m.type[0]==='E'&&team.length===1){d+=8;}
      if(m.type[0]==='I'&&['pub','bar','club'].includes(st.kind))d+=6;
      if(m.type[1]==='N'&&['conv','pojang'].includes(st.kind))d+=3;
      if(m.type[1]==='S'&&S.day-st.opened<7&&st.opened>1)d+=3;
      for(const o of team){if(o===m)continue;const p=pairInfo(m.type,o.type);if(p.v<=-4)d+=p.v<=-15?10:5;if(p.v>=8)d-=3}
      if(has(team,'ENFJ')&&m.type!=='ENFJ')d-=6;
      if(has(team,'ISFJ')&&m.type!=='ISFJ')d-=3;
      const q=QUIRKS[m.quirk].k;
      if(q==='coffee')d+=st.kind==='cafe'?-4:3;
      if(q==='perfect')d+=2;
      if(m.boss)d=Math.round(d*.5);
      addStress(m,d,d<0);
      m.xp+=10;
      if(m.xp>=m.lv*20&&m.lv<50){m.xp-=m.lv*20;m.lv++;msgs.push(`⬆️ ${m.name}(${m.type}) Lv.${m.lv} 달성`)}
    }
    // 조합 발견
    for(const p of teamCompat(team).pairs){
      const key=pairKey(p.a.type,p.b.type);
      if(SPECIAL[key]&&!S.found.combos.includes(key)){S.found.combos.push(key);S.wq.combo++;
        msgs.push(SPECIAL[key].k==='hidden'?`✨ <b style="color:var(--gold)">히든 조합 발견! ${p.a.type}+${p.b.type} '${SPECIAL[key].n}'</b> (궁합 +${SPECIAL[key].v}%)`:`📖 조합 확인: ${p.a.type}+${p.b.type} '${SPECIAL[key].n}' (${SPECIAL[key].v>0?'+':''}${SPECIAL[key].v}%)`)}
    }
  }
  for(const m of idle){
    let d=m.type[0]==='I'?-30:-15;
    if(QUIRKS[m.quirk].k==='home')d*=1.5;
    addStress(m,d,true);
  }
  // 흑화 진입·회복·퇴사
  for(const m of S.staff.slice()){
    if(m.boss)continue;
    if(m.dark&&m.stress<70){m.dark=0;msgs.push(`🌤 ${m.name}(${m.type}) 흑화에서 돌아왔다`);continue}
    if(m.stress>=90){
      if(!m.dark){m.dark=1;msgs.push(`🌑 <b style="color:#d4a8ff">${m.name}(${m.type}) 흑화!</b> ${DARK[m.type][0]}. 3일 안에 달래야 해요`);continue}
      m.dark++;
      if(m.dark>3){
        const st=m.storeId?storeById(m.storeId):null;
        if(st&&has(teamOf(st),'ISFJ')&&!m.savedOnce&&m.type!=='ISFJ'){m.savedOnce=true;m.stress=75;m.dark=0;msgs.push(`🍱 ISFJ의 도시락: ${m.name}이(가) 그만두려다 마음을 돌렸다`);continue}
        quit(m);
        msgs.push(`🚪 <span class="dn">${m.name}(${m.type}) ${m.type[2]==='T'?'라이벌 회사로 떠났다. "여긴 비효율적이에요."':m.type[0]==='E'?'돌발 퇴사! "더는 못 하겠어요!"':'잠수… 연락이 끊겼다.'}</span>`);
      }
    }
  }
  // 퀘스트
  const qd=S.quest.d,qw=S.quest.w;
  const dOk={calm:()=>S.staff.every(x=>x.stress<60),gift:()=>S.dq.gift,good:()=>S.dq.good,rev:()=>totRev>=qd.target}[qd.id]();
  if(!qd.done&&dOk){qd.done=true;S.cash+=qd.reward;msgs.push(`📌 오늘의 목표 달성! +${fmt(qd.reward)}`)}
  const wOk={hire:()=>S.wq.hire>=1,combo:()=>S.wq.combo>=1,profit:()=>S.wq.profit>=qw.target}[qw.id]();
  if(!qw.done&&wOk){qw.done=true;S.cash+=qw.reward;msgs.push(`🗓 주간 목표 달성! +${fmt(qw.reward)}`)}
  // 일기장
  if(S.flags.rival&&!S.diary.includes('rival'))msgs.push(unlockDiary('rival'));
  if(S.found.combos.filter(k=>SPECIAL[k].k==='hidden').length>=3&&!S.diary.includes('combo3'))msgs.push(unlockDiary('combo3'));
  // 수사망
  if(S.heat>0){
    if(S.day-S.lastCard>7)S.heat=Math.max(0,S.heat-2);
    const F=S.staff.filter(x=>x.type[2]==='F'&&!x.boss);
    if(S.heat>=30&&!S.heatFlags[30]){S.heatFlags[30]=1;S.rep=clamp(S.rep-.1,1,5);msgs.push('🕵️ 수사망 30: 이상한 소문이 돌기 시작했다. 단골 일부 이탈 (평판 -0.1)')}
    if(S.heat>=50&&!S.heatFlags[50]){S.heatFlags[50]=1;const c=Math.max(100,Math.round(S.cash*.15));S.cash-=c;S.heat-=20;msgs.push(`🕵️ 수사망 50: <span class="dn">세무조사!</span> 추징금 -${fmt(c)} (수사망 -20)`)}
    if(S.heat>=70&&!S.heatFlags[70]&&F.length){S.heatFlags[70]=1;const v=R(F);addStress(v,25);msgs.push(`🕵️ 수사망 70: 전담 수사관이 ${v.name}(${v.type})를 회유하려 한다. 양심 갈등 스트레스 +25`)}
    if(S.heat<30)S.heatFlags={};
  }
  if(S.cash<0)msgs.push('<span class="dn">⚠️ 현금이 마이너스예요! 인건비·임대료를 점검하세요.</span>');

  S.stats.days++;
  S.day++;
  // 주간 처리
  let weekly='';
  if(weekday(S.day)===0){
    rollCandidates();
    newQuests(false,true);
    const rv=R(RIVALS),dkeys=Object.keys(DISTRICTS);
    const myD=S.stores.map(s=>s.district);
    const d=Math.random()<.6&&myD.length?R(myD):R(dkeys);
    if(buffOn('blackout')){S.news=null;weekly=`<div class="notes">📅 <b>새로운 한 주</b> — 채용 후보 3명 도착!<br>🔌 라이벌들의 매장이 원인 모를 정전으로 조용하다…</div>`}
    else{S.news={...rv,district:d,until:S.day+6};weekly=`<div class="notes">📅 <b>새로운 한 주</b> — 채용 후보 3명 도착!<br>📰 ${rv.n}(${rv.t})이(가) ${DISTRICTS[d].n}에서 ${rv.a}.</div>`}
  }
  newQuests(true);
  // 황금 시간 (내일)
  S.golden=Math.random()<.12?{district:R(S.stores.map(x=>x.district)),day:S.day}:null;
  rollNextEvents();
  const infj=S.staff.some(s=>s.type==='INFJ');
  let forecast='';
  if(infj&&S.nextEvents.length){forecast=`<div class="notes">🔮 <b>INFJ 예지몽</b> — 내일: ${S.nextEvents.map(x=>{const e=EVENTS.find(v=>v.id===x.id);return e.e+' '+e.t}).join(', ')}</div>`}
  if(S.golden)forecast+=`<div class="notes">📰 <b>내일 속보</b> — ${DISTRICTS[S.golden.district].n}에 큰 행사! 황금 시간 예고 ⏰</div>`;
  const chatOn=S.staff.length>=3&&Math.random()<.35;

  save();
  modalLock=false;
  openModal(`<div class="small muted">${day}일차 · ${WD[weekday(day)]}요일 정산</div><h2 style="margin-bottom:12px">${totProfit>=0?'💰':'📉'} 순이익 <span class="${totProfit>=0?'up':'dn'}">${totProfit>=0?'+':''}${fmt(totProfit)}</span></h2>
    ${rows.map(({st,r,cogs,wages,rent,profit,fx})=>`<div class="settle-store"><div class="between"><b>${KINDS[st.kind].e} ${KINDS[st.kind].n}</b><b class="${profit>=0?'up':'dn'}">${profit>=0?'+':''}${fmt(profit)}</b></div>
      <table class="tbl"><tr><td>매출 ${r.team.length?`<span class="muted small">(효율 ${Math.round(r.eff*100)}% · 궁합 ${r.comp>0?'+':''}${r.comp}%${fx.rev!==1?` · 이벤트 ×${fx.rev.toFixed(2)}`:''})</span>`:'<span class="dn small">직원 없음</span>'}</td><td>${fmt(r.rev)}</td></tr>
      <tr><td>원가</td><td>-${fmt(cogs)}</td></tr><tr><td>인건비</td><td>-${fmt(wages)}</td></tr><tr><td>임대료</td><td>-${fmt(rent)}</td></tr>${fx.cash?`<tr><td>이벤트</td><td>${fx.cash>0?'+':''}${fmt(fx.cash)}</td></tr>`:''}</table>
      ${r.notes.length?`<div class="small muted" style="margin-top:6px">${r.notes.join('<br>')}</div>`:''}</div>`).join('')}
    ${idleW?`<div class="between small" style="margin:0 2px 10px"><span class="muted">휴무 직원 급여</span><span>-${fmt(idleW)}</span></div>`:''}
    ${msgs.length?`<div class="notes">${msgs.join('<br>')}</div>`:''}
    ${weekly}${forecast}
    ${chatOn?`<button class="btn" id="chatBtn" style="margin-bottom:8px">💬 사내 단톡방 엿보기 <span class="small muted">· 들키면 충성도 하락</span></button>`:''}
    <button class="btn primary" id="nextDay">다음 날로</button>`);
  $('nextDay').onclick=afterSettle;
  if(chatOn)$('chatBtn').onclick=chatRoom;
}
function afterSettle(){
  closeModal();render();
  if(S.heat>=90)return raid();
  checkChapter();
}
function chatRoom(){
  const ppl=S.staff.filter(s=>!s.boss).sort(()=>Math.random()-.5).slice(0,4);
  const lines=ppl.map(p=>({p,t:R(CHAT[p.type])}));
  const pair=S.staff.filter(s=>!s.boss);
  if(pair.length>=3){const [a,b,c]=pair.sort(()=>Math.random()-.5);lines.splice(1,0,{p:c,t:R([`${a.name}이랑 ${b.name} 요즘 수상하지 않음?👀`,'사장님 오늘 기분 안 좋으신 듯… 조심','T야? 진짜 T야?','계획 틀어졌어… 기 다 빨렸어'])})}
  const caught=Math.random()<.25;
  if(caught)S.staff.forEach(s=>!s.boss&&addStress(s,5));
  save();
  openModal(`<div class="small muted">💬 ${esc(S.company)} 직원 단톡방 (사장 없음)</div><h2 style="margin:4px 0 12px">사내 카더라</h2>
    ${lines.map(({p,t})=>`<div class="row" style="align-items:flex-start;margin-bottom:10px">${avatar(p.type,34)}<div><div class="small muted">${esc(p.name)} · ${p.type}</div><div class="result" style="padding:8px 12px;margin:2px 0 0;font-size:13px;border-radius:4px 14px 14px 14px">${esc(t)}</div></div></div>`).join('')}
    ${caught?`<div class="notes dn">👀 "…방금 누가 읽었어? 1 사라졌는데" — 들켰다! 직원 전원 스트레스 +5</div>`:''}
    <button class="btn primary" id="chatOk">나가기</button>`);
  $('chatOk').onclick=afterSettle;
}
function raid(){
  const vic=S.staff.filter(s=>!s.boss).sort((a,b)=>GRADES[b.grade].mul-GRADES[a.grade].mul)[0];
  const fine=Math.round(Math.max(200,S.cash*.3));
  modalLock=true;
  openModal(`<div class="ev-ic">🚨</div><h2>압수수색!</h2><p class="lead">수사망 ${S.heat}. 수사관들이 장부를 들고 나간다. 누군가는 책임져야 한다.</p>
    ${vic?`<button class="opt" data-r="scape"><b>🐐 희생양: ${esc(vic.name)}(${vic.type})에게 뒤집어씌우기</b>${vic.name}은(는) 회사를 떠나고 수사망 -45. 직원 전원 스트레스 +15</button>`:''}
    <button class="opt" data-r="fine"><b>💸 벌금 납부</b>${fmt(fine)} · 수사망 -35</button>`);
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    if(b.dataset.r==='scape'){quit(vic);S.heat-=45;S.staff.forEach(s=>!s.boss&&addStress(s,15))}
    else{S.cash-=fine;S.heat-=35}
    S.heat=Math.max(0,S.heat);modalLock=false;save();closeModal();render();checkChapter();
  });
}
function brokerModal(){
  if(!S.flags.broker){S.flags.broker=1;save();
    openModal(`<div class="ev-ic">🃏</div><h2>검은 명함</h2><p class="lead">마감 후, 낯선 남자가 테이블에 명함 한 장을 놓고 갔다. "규칙대로 하면 페르소나를 못 이겨요. 필요하면 연락 주쇼."</p>
      <div class="notes">반칙 카드는 효과가 크지만 <b>수사망</b>이 쌓여요. F형 직원은 양심 갈등으로 스트레스를 받아요. 반칙 없이 엔딩을 보면 '깨끗한 대표' 칭호!</div>
      <button class="btn primary" onclick="brokerModal()">브로커 만나기</button>`);
    return;
  }
  const fee=30+S.stores.length*20,law=100+S.stores.length*40,char=300+S.stores.length*80;
  openModal(`<h2>🕶 뒷골목 브로커</h2>
    <div class="between small" style="margin:6px 0 4px"><span>수사망</span><b class="${S.heat>=50?'dn':''}">${S.heat} / 100</b></div>
    <div class="bar" style="margin-bottom:12px"><span style="width:${S.heat}%;background:linear-gradient(90deg,#a15bff,#ff3b5c)"></span></div>
    <p class="small muted" style="margin:0 0 10px">30 소문 · 50 세무조사 · 70 수사관 · 90 압수수색 · 반칙을 7일 안 쓰면 매일 -2</p>
    ${CARDS.map(c=>{const pro=S.staff.find(x=>c.good.includes(x.type));const on=buffOn(c.id);
      return `<button class="opt" data-card="${c.id}" ${on?'disabled style="opacity:.45"':''}><b>${c.e} ${c.n} ${on?'· 진행 중':''}</b>${c.d}<br><span class="muted">수수료 ${fmt(fee)} · 수사망 +${c.heat}${pro?` <span class="up">→ ${esc(pro.name)}(${pro.type})가 처리하면 -5</span>`:` · 잘하는 유형: ${c.good.join(', ')}`}</span></button>`}).join('')}
    <div class="sec-t">수사망 낮추기</div>
    <button class="opt" data-law><b>⚖️ 변호사 선임</b>${fmt(law)} · 수사망 -20</button>
    <button class="opt" data-char><b>🤝 자선 사업</b>${fmt(char)} · 수사망 -30, 평판 +0.1</button>
    <button class="btn ghost" onclick="closeModal()">닫기</button>`);
  document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{
    const c=CARDS.find(x=>x.id===b.dataset.card);if(buffOn(c.id))return;
    if(S.cash<fee)return toast('현금이 부족해요');
    S.cash-=fee;S.cardsUsed++;S.lastCard=S.day;
    const pro=S.staff.find(x=>c.good.includes(x.type));
    S.heat=clamp(S.heat+c.heat-(pro?5:0),0,100);
    if(c.dur)S.buffs=activeBuffs().concat([{id:c.id,until:S.day+c.dur-1}]);
    if(c.id==='review')S.rep=clamp(S.rep+.5,1,5);
    if(c.id==='blackout')S.news=null;
    const F=S.staff.filter(x=>x.type[2]==='F'&&!x.boss);
    F.forEach(x=>addStress(x,c.id==='slave'?30:15));
    save();render();
    openModal(`<div class="ev-ic">${c.e}</div><h2>${c.n}</h2><p class="lead">${pro?`${esc(pro.name)}(${pro.type}): "${pro.type[2]==='T'?'깔끔하게 처리했습니다.':'…시키는 대로 했어요.'}"`:'브로커가 일을 처리했다.'}</p>
      <div class="notes">${c.d}<br>수사망 → ${S.heat}${F.length?`<br><span class="dn">😣 F형 직원 ${F.length}명 양심 갈등 (스트레스 +${c.id==='slave'?30:15})</span>`:''}</div>
      <button class="btn primary" onclick="closeModal()">확인</button>`);
  });
  document.querySelector('[data-law]').onclick=()=>{if(S.cash<law)return toast('현금이 부족해요');S.cash-=law;S.heat=Math.max(0,S.heat-20);save();render();brokerModal()};
  document.querySelector('[data-char]').onclick=()=>{if(S.cash<char)return toast('현금이 부족해요');S.cash-=char;S.heat=Math.max(0,S.heat-30);S.rep=clamp(S.rep+.1,1,5);save();render();brokerModal()};
}
function checkChapter(){
  if(!chapterDone())return;
  const c=CHAPTERS[S.chapter];
  S.chapter++;
  c.unlock.forEach(u=>{if(!S.unlocked.includes(u))S.unlocked.push(u)});
  const dk=['ch1','ch2','ch3','end'][S.chapter-1];
  const diary=dk&&dk!=='end'?unlockDiary(dk):'';
  const nx=CHAPTERS[S.chapter];
  save();render();
  if(!nx){ending();return}
  openModal(`<div class="ev-ic">🎊</div><h2>${c.t} 클리어!</h2><p class="lead">보상: ${c.reward}${S.chapter===1?' · 🕶 뒷골목 브로커 등장':''}</p>
    ${diary?`<div class="notes">${diary}</div>`:''}
    <div class="notes"><b>${nx.t}</b><br>${nx.story}</div><button class="btn primary" onclick="closeModal()">계속</button>`);
}
function ending(){
  const hid=S.found.combos.filter(k=>SPECIAL[k]&&SPECIAL[k].k==='hidden').length;
  const diary=unlockDiary('end');save();
  openModal(`<div class="ev-ic">🌃</div><h2>1막 · 골목의 왕</h2>
    <p class="lead">${S.day-1}일 만에 포장마차 하나에서 나이트클럽까지. 그리고 삼촌의 마지막 일기장 조각을 찾았다.</p>
    <div class="notes">${diary}</div>
    <div class="notes">${S.cardsUsed?`😈 <b>반칙 ${S.cardsUsed}회</b>의 대표`:'😇 <b>깨끗한 대표</b> 칭호 획득'}<br>매장 ${S.stores.length}개 · 직원 ${S.staff.length}명 · 평판 ★${S.rep.toFixed(1)}<br>도감 ${S.found.types.length}/16 · 히든 조합 ${hid}/${HIDDEN_TOTAL} · 일기장 ${S.diary.length}/${DIARY.length}</div>
    <p class="small muted">2막 「대륙 진출 — 솔트하버」는 정식 버전에서 이어집니다.</p>
    <div class="stack"><button class="btn primary" id="endOrg">📸 조직도 카드 보기</button><button class="btn ghost" onclick="closeModal()">계속 운영하기</button></div>`);
  $('endOrg').onclick=orgCard;
}
function orgCard(){
  const boss=S.staff.find(s=>s.boss);
  const top=S.staff.filter(s=>!s.boss).sort((a,b)=>({SSR:4,SR:3,R:2,N:1}[b.grade]-{SSR:4,SR:3,R:2,N:1}[a.grade])||b.lv-a.lv).slice(0,6);
  const person=s=>`<div class="org-p">${avatar(s.type)}<b>${s.type}</b><div class="muted">${esc(s.name)}</div></div>`;
  const hid=S.found.combos.filter(k=>SPECIAL[k]&&SPECIAL[k].k==='hidden');
  openModal(`<div class="orgcard"><div class="o-t">ORGANIZATION CHART</div><h3>${esc(S.company)}</h3>
    <div class="org-row">${boss?person(boss):''}</div>
    <div class="org-row">${top.map(person).join('')}</div>
    <div class="small muted" style="line-height:1.7">${S.day-1}일차 · 매장 ${S.stores.length}개 · ★${S.rep.toFixed(1)}<br>${hid.length?'✨ '+hid.map(k=>SPECIAL[k].n).join(' · '):'아직 히든 조합 없음'}</div>
    <div style="margin-top:12px;font-weight:900;font-size:13px;color:var(--orange)">MBTI 시티 타이쿤</div></div>
    <p class="small muted" style="text-align:center">스크린샷으로 저장해 공유해 보세요</p>
    <button class="btn ghost" onclick="closeModal()">닫기</button>`);
}

/* 시작 */
renderIntro();
</script>
</body>
</html>
