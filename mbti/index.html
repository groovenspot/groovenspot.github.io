<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0808" />
<title>MBTI 시티 타이쿤</title>
<meta name="description" content="골목 포장마차 하나로 시작해 MBTI 16유형 직원을 뽑고 굴려서 네온시티 상권을 장악하는 경영 시뮬레이션 프로토타입." />
<style>
:root{
  --bg:#0b0808;--bg-2:#141010;--card:#171213;--card-2:#211919;--card-3:#2b2121;
  --line:rgba(255,255,255,.09);--txt:#fbf1ec;--muted:#a99a95;
  --orange:#ff7a1a;--orange-2:#ff4d00;--gold:#ffcf7a;--red:#ff3b5c;
  --purple:#a15bff;--teal:#2ec4b6;--blue:#4d8dff;--green:#43d17a;
  --fire:linear-gradient(105deg,#ff4d00 0%,#ff7a1a 50%,#ffcf7a 100%);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  min-height:100%;overscroll-behavior:none}
body{background:radial-gradient(1200px 600px at 50% -10%,#2a1410 0%,var(--bg) 60%) fixed}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom));min-height:100vh}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:800;background:var(--card-2);border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--fire);color:#1a0a00;border:0}
.btn.ghost{background:transparent}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
h1,h2,h3,h4{margin:0}
.up{color:#7dffb0}.dn{color:#ff8fa3}

/* 시작 화면 */
#intro{padding-top:24px}
.logo{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1.05;background:var(--fire);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-story{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;font-size:14px;line-height:1.7;margin:16px 0}
.field{display:block;width:100%;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:16px;outline:none}
.field:focus{border-color:var(--orange)}
.lbl{font-size:13px;font-weight:800;margin:18px 0 8px;display:block}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tcell{padding:10px 2px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:12px;font-weight:800}
.tcell .e{font-size:22px;display:block;margin-bottom:2px}
.tcell.on{border-color:var(--gold);background:#2a1d10}

/* 상단 바 */
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:12px 0 10px;margin:0 -2px}
.hud-top{display:flex;justify-content:space-between;align-items:baseline}
.co{font-weight:900;font-size:17px}
.day{font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:16px}
.kpi span{font-size:11px;color:var(--muted)}
.goal{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px}
.goal .g-t{font-weight:800;font-size:13px;margin-bottom:4px}
.gl{display:flex;justify-content:space-between;gap:6px;margin-top:3px}
.bar{height:6px;background:var(--card-3);border-radius:6px;overflow:hidden;margin-top:3px}
.bar span{display:block;height:100%;border-radius:6px;background:var(--fire)}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(11,8,8,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.tabs-in{max-width:560px;margin:0 auto}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.tab{padding:7px 0;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;position:relative}
.tab .i{font-size:18px;display:block}
.tab.on{color:var(--txt);background:var(--card-2)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--red)}
.page{display:none}.page.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-t{font-size:13px;font-weight:800;color:var(--muted);margin:14px 2px 8px}

/* 매장 */
.store{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.store-h{display:flex;gap:10px;align-items:center}
.store-ic{width:44px;height:44px;border-radius:12px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.store-h h3{font-size:16px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:12px}
.slot{min-height:76px;border-radius:12px;background:var(--bg-2);border:1px dashed rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;text-align:center;font-size:12px}
.slot.f{border-style:solid;border-color:var(--line);background:var(--card-2)}
.slot .e{font-size:22px;line-height:1.1}
.slot .n{font-weight:800;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .ty{font-size:10px;font-weight:800}
.sbar{width:80%;height:4px;background:var(--card-3);border-radius:4px;margin-top:4px;overflow:hidden}
.sbar span{display:block;height:100%}
.compat{margin-top:10px;font-size:12px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card-2);white-space:nowrap}
.chip.good{background:rgba(67,209,122,.14);color:#7dffb0}
.chip.bad{background:rgba(255,59,92,.14);color:#ff8fa3}
.chip.hid{background:rgba(255,207,122,.15);color:var(--gold)}
.store-f{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}

/* 직원 */
.emp{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left;width:100%}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;border:2px solid var(--line)}
.emp .mid{flex:1;min-width:0}
.emp .nm{font-weight:800;font-size:14px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.emp .sub{font-size:11px;color:var(--muted);margin-top:2px}
.gr{font-size:10px;font-weight:900;padding:1px 6px;border-radius:5px}
.gr-N{background:#3a3030;color:#cfc3bf}.gr-R{background:#14304f;color:#8cc2ff}.gr-SR{background:#3a1d55;color:#d4a8ff}.gr-SSR{background:linear-gradient(90deg,#ff4d00,#ffcf7a);color:#1a0a00}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:20px;margin-bottom:6px}
.modal .lead{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 14px}
.ev-ic{font-size:44px;margin-bottom:6px}
.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.65;margin-bottom:12px}
.fx{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:5px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:900;border-bottom:0;font-size:15px;padding-top:9px}
.settle-store{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.notes{font-size:13px;line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.stats6{display:grid;grid-template-columns:38px 1fr 26px;gap:5px 8px;align-items:center;font-size:12px;margin:10px 0}
.stats6 .b{height:6px;background:var(--card-3);border-radius:6px;overflow:hidden}
.stats6 .b span{display:block;height:100%;border-radius:6px;background:var(--orange)}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.5;margin-bottom:8px}
.opt:active{border-color:var(--orange)}
.opt b{display:block;font-size:15px;margin-bottom:2px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--card-3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:40;animation:fade .2s;max-width:90vw;text-align:center}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;font-weight:800}
.dex div.no{opacity:.3;filter:grayscale(1)}
.dex .e{font-size:22px;display:block}
.combo{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:13px}
.orgcard{background:linear-gradient(160deg,#2a1206,#0b0808 60%);border:1px solid rgba(255,122,26,.4);border-radius:22px;padding:22px 18px;text-align:center}
.orgcard .o-t{font-size:12px;letter-spacing:.2em;color:var(--orange);font-weight:800}
.orgcard h3{font-size:24px;margin:6px 0 16px}
.org-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.org-p{width:76px;text-align:center;font-size:11px}
.org-p .av{margin:0 auto 4px;width:52px;height:52px;font-size:28px}
</style>
</head>

  ['INFJ','ENFP',25,'운명적 만남','hidden'],['INTP','ENTP',18,'밤샘 토론 클럽','hidden'],['ISFJ','ESFJ',18,'엄마 손맛 듀오','hidden'],
  ['ISTP','ESTP',18,'익스트림 브라더스','hidden'],['ESFP','ENFP',18,'흥 폭발','hidden'],['INFP','ISFP',16,'감성 아틀리에','hidden'],
  ['ENFJ','INFP',18,'멘토와 몽상가','hidden'],['ESTJ','ISTJ',14,'엑셀 장인들','hidden'],['INTJ','ENTJ',16,'세계 정복 계획','hidden'],
  ['ISFP','ESFJ',14,'플레이팅 장인','hidden'],['INTJ','INFJ',14,'고요한 천재들','hidden'],['ENTP','INFJ',16,'철학 카페','hidden'],
].forEach(([a,b,v,n,k])=>SPECIAL[pairKey(a,b)]={v,n,k});
const HIDDEN_TOTAL=Object.values(SPECIAL).filter(s=>s.k==='hidden').length;
function pairInfo(a,b){
  const sp=SPECIAL[pairKey(a,b)];
  if(sp) return sp;
  let v=0;
  if(a===b) v-=3;
  if(a[0]!==b[0]) v+=3;
  if(a[1]===b[1]) v+=4;
  if(a[2]!==b[2]) v+=2;
  v+= a[3]===b[3]?2:-3;
  if(a[0]==='E'&&b[0]==='E'&&a[2]==='T'&&b[2]==='T'&&a[3]==='J'&&b[3]==='J') v-=10;
  return {v,k:v>=8?'good':v<=-4?'bad':'norm'};
}
const SURN='김이박최정강조윤장임한오서신권황안송류홍'.split('');
const GIVEN=['민준','서연','도윤','하은','지호','수아','예준','지유','시우','서윤','주원','하린','은우','채원','유준','지안','태오','나연','건우','소율','현우','다인','준서','예린','로운','아린','승현','유나','재희','보람'];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(v){
  const neg=v<0;v=Math.abs(Math.round(v));
  let s= v>=10000 ? (v/10000).toFixed(v>=100000?0:1).replace(/\.0$/,'')+'억' : v.toLocaleString()+'만';
  return (neg?'-':'')+s;
}

function rollGrade(bonus=0){
  const rep=S?S.rep:3;
  const w={N:Math.max(20,60-(rep-3)*12-bonus*40),R:28+bonus*10,SR:10+(rep-3)*8+bonus*22,SSR:2+(rep-3)*3+bonus*8};
  let tot=Object.values(w).reduce((a,b)=>a+Math.max(0,b),0),r=Math.random()*tot;
  for(const g in w){r-=Math.max(0,w[g]);if(r<=0)return g}
  return 'N';
}
function makeStaff(type,grade,opts={}){
  return {id:++S.seq,name:opts.name||R(SURN)+R(GIVEN),type,grade,lv:1,xp:0,stress:opts.stress||10,
    quirk:opts.quirk!==undefined?opts.quirk:Math.floor(Math.random()*QUIRKS.length),
    boss:!!opts.boss,storeId:null,care:{}, savedOnce:false};
}
function baseStats(t){
  const s={서비스:4,기획:4,실행:4,감각:4,영업:4,멘탈:4};
  if(t[0]==='E'){s.서비스+=2;s.영업+=2}else{s.기획+=2;s.멘탈+=2}
  if(t[1]==='S'){s.실행+=2;s.감각+=2}else{s.기획+=2;s.감각+=1}
  if(t[2]==='T'){s.영업+=1;s.기획+=1}else{s.서비스+=2}
  if(t[3]==='J'){s.실행+=1;s.멘탈+=1}else{s.감각+=1;s.영업+=1}
  return s;
}
function stats(st){
  const s=baseStats(st.type),q=QUIRKS[st.quirk];
  if(q.st) for(const k in q.st) s[k]+=q.st[k];
  const m=GRADES[st.grade].mul*(1+.03*(st.lv-1));
  for(const k in s) s[k]=Math.max(1,Math.round(s[k]*m));
  return s;
}
const wage=st=>st.boss?0:Math.round(GRADES[st.grade].wage*(1+.02*(st.lv-1)));
const storeById=id=>S.stores.find(s=>s.id===id);
const teamOf=store=>S.staff.filter(s=>s.storeId===store.id);
const staffById=id=>S.staff.find(s=>s.id===id);

function teamCompat(team){
  let tot=0;const pairs=[];
  for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){
    const p=pairInfo(team[i].type,team[j].type);
    tot+=p.v;pairs.push({a:team[i],b:team[j],...p});
  }
  return {pct:clamp(tot,-30,50),pairs};
}

  if(team.length<2) return `<span class="muted">직원이 2명 이상이면 궁합이 계산돼요</span>`;

function teamPreview(store,cand){
  const team=teamOf(store).filter(m=>m!==cand);
  const before=team.length>=2?teamCompat(team).pct:0;
  const after=teamCompat([...team,cand]).pct;
  return {before,after,d:after-before};
}

    <button class="btn primary" id="hireBtn">채용 · 계약금 ${fmt(fee)} (일급 ${fmt(wage(c))})</button>
    <button class="btn ghost" onclick="closeModal()" style="margin-top:8px">다음에</button>`);
  $('hireBtn').onclick=()=>{

function scout(t){
  if(S.chapter<1)return;
  const c=scoutCost();
  const cand=makeStaff(t,rollGrade(1));
  if(S.cash<c+signFee(cand))return toast(`현금이 부족해요 (지명비 ${fmt(c)} + 계약금 약 ${fmt(signFee(cand))})`);
  S.cash-=c;S.candidates.unshift(cand);save();render();candModal(cand.id);
}
function discoverType(t){if(!S.found.types.includes(t))S.found.types.push(t)}
function addStress(s,d,care){
  if(d>0&&!care){const q=QUIRKS[s.quirk].k;if(q==='steel')d*=.7;if(q==='glass')d*=1.3}
  s.stress=clamp(Math.round(s.stress+d),0,100);
}

function rollNextEvents(){
  const out=[];
  const n=Math.random()<.55?2:1;
  const used=new Set();
  for(let i=0;i<n;i++){
    const ev=R(EVENTS);
    if(used.has(ev.id)){continue}
    used.add(ev.id);out.push({id:ev.id,storeIdx:Math.floor(Math.random()*99)});
  }
  S.nextEvents=out;
}
function pickEventStore(ev,storeIdx){
  const ok=S.stores.filter(st=>{const team=teamOf(st);const need=ev.need||1;
    if(ev.id==='poach')return team.some(m=>!m.boss);
    if(ev.id==='romance')return team.filter(m=>!m.boss).length>=2;
    return team.length>=need});
  if(!ok.length)return null;
  return ok[storeIdx%ok.length];
}

function runDay(){
  if(!S)return;
  if(!S.staff.some(s=>s.storeId))return toast('매장에 직원을 1명 이상 배치하세요');
  dayFx={};S.stores.forEach(st=>dayFx[st.id]={rev:1,cash:0,rep:0,notes:[]});
  const queue=(S.nextEvents||[]).map(x=>{const ev=EVENTS.find(e=>e.id===x.id);const st=pickEventStore(ev,x.storeIdx);return st?{ev,st}:null}).filter(Boolean);
  modalLock=true;
  const next=()=>{if(!queue.length)return settle();const {ev,st}=queue.shift();showEvent(ev,st,next)};

function applyResult(res,h,st){
  const fx=dayFx[st.id],B=KINDS[st.kind].base;
  if(res.rev)fx.rev*=res.rev;
  if(res.cash)fx.cash+=Math.round(res.cash*B);
  if(res.rep)fx.rep+=res.rep;
  if(res.st&&h)addStress(h,res.st,res.st<0);
  const chips=[];
  if(res.rev&&res.rev!==1)chips.push(`<span class="chip ${res.rev>1?'good':'bad'}">오늘 매출 ×${res.rev.toFixed(2)}</span>`);
  if(res.cash)chips.push(`<span class="chip ${res.cash>0?'good':'bad'}">현금 ${res.cash>0?'+':''}${fmt(Math.round(res.cash*B))}</span>`);
  if(res.rep)chips.push(`<span class="chip ${res.rep>0?'good':'bad'}">평판 ${res.rep>0?'+':''}${res.rep.toFixed(2)}</span>`);
  if(res.st&&h)chips.push(`<span class="chip ${res.st<0?'good':'bad'}">${esc(h.name)} 스트레스 ${res.st>0?'+':''}${res.st}</span>`);
  return chips.join('');
}

function storeRevenue(st,fx){
  const k=KINDS[st.kind],team=teamOf(st);
  if(!team.length)return {rev:0,team,comp:0,eff:0,notes:[]};
  const notes=[];
  let power=0;
  for(const m of team){const s=stats(m);let p=s[k.keys[0]]+s[k.keys[1]];
    if(QUIRKS[m.quirk].k==='night'&&['pub','bar','club'].includes(st.kind))p*=1.15;
    if(m.stress>=70&&Math.random()<.3){p*=.6;notes.push(`😵 ${m.name} 실수 연발 (스트레스 ${m.stress})`)}
    power+=p}
  let eff=clamp(power/(k.slots*14),.15,2.5);
  if(has(team,'ENTJ')){eff*=1.2;notes.push('👑 ENTJ 지휘: 효율 +20%')}
  const comp=teamCompat(team).pct;
  let m=DISTRICTS[st.district].m[st.kind]*(isWeekend(S.day)?k.wk[1]:k.wk[0]);
  if(DISTRICTS[st.district].weekendDead&&isWeekend(S.day))m*=.5;
  if(S.news&&S.news.until>=S.day&&S.news.district===st.district)m*=.85;
  m*=.6+S.rep*.12;
  m*=1+st.interior*.08*(has(team,'ISFP')?2:1);
  if(has(team,'ESTJ')){m*=1.1;notes.push('📊 ESTJ 일정 통제: +10%')}
  if(has(team,'ESFJ'))m*=1.08;
  if(has(team,'ENFP')&&Math.random()<.15){m*=1.5;notes.push('🎉 ENFP 텐션 점화! 손님 +50%')}
  if(has(team,'ESFP'))m*=['bar','club'].includes(st.kind)?1.5:1.1;
  if(st.kind==='conv')m*=1+.06*team.filter(x=>x.type[3]==='J').length;
  if(st.kind==='club')m*=1+.06*team.filter(x=>x.type[0]==='E').length;
  const noise=has(team,'INTJ')?1.05:.9+Math.random()*.2;
  const rev=Math.round(k.base*eff*(1+comp/100)*m*fx.rev*noise);
  return {rev,team,comp,eff,notes};
}
function settle(){

    const cogs=Math.round(r.rev*Math.max(.2,k.cr-.01*nT));
    const wages=r.team.reduce((a,m)=>a+wage(m),0);
    const rent=rentOf(st);
    const profit=r.rev-cogs-wages-rent+fx.cash;

    rows.push({st,r,cogs,wages,rent,profit,fx});
    // 평판 변화
    if(r.team.length){
      const svc=r.team.reduce((a,m)=>a+stats(m).서비스,0)/r.team.length;
      let dr=(svc-10)*.004+fx.rep-(S.rep-3)*.015;
      if(has(r.team,'INFP'))dr+=.03;
      S.rep=clamp(S.rep+dr/Math.max(1,S.stores.length*.6),1,5);
    }
  }
  const idle=S.staff.filter(s=>!s.storeId);
  const idleW=idle.reduce((a,s)=>a+wage(s),0);
  totProfit-=idleW;
  S.cash+=totProfit;S.totalProfit+=Math.max(0,totProfit);
  S.bestDayRev=Math.max(S.bestDayRev,totRev);

  // 스트레스·성장
  for(const st of S.stores){
    const team=teamOf(st);
    for(const m of team){
      let d=6;
      if(m.type[0]==='E'&&team.length===1){d+=8;}
      if(m.type[0]==='I'&&['pub','bar','club'].includes(st.kind))d+=6;
      if(m.type[1]==='N'&&['conv','pojang'].includes(st.kind))d+=3;
      if(m.type[1]==='S'&&S.day-st.opened<7&&st.opened>1)d+=3;
      for(const o of team){if(o===m)continue;const p=pairInfo(m.type,o.type);if(p.v<=-4)d+=p.v<=-15?10:5;if(p.v>=8)d-=3}
      if(has(team,'ENFJ')&&m.type!=='ENFJ')d-=6;
      if(has(team,'ISFJ')&&m.type!=='ISFJ')d-=3;
      const q=QUIRKS[m.quirk].k;
      if(q==='coffee')d+=st.kind==='cafe'?-4:3;
      if(q==='perfect')d+=2;
      if(m.boss)d=Math.round(d*.5);
      addStress(m,d,d<0);
      m.xp+=10;
      if(m.xp>=m.lv*20&&m.lv<50){m.xp-=m.lv*20;m.lv++;msgs.push(`⬆️ ${m.name}(${m.type}) Lv.${m.lv} 달성`)}
    }
    // 히든 조합 발견
    for(const p of teamCompat(team).pairs){
      const key=pairKey(p.a.type,p.b.type);
      if(SPECIAL[key]&&!S.found.combos.includes(key)){S.found.combos.push(key);
        msgs.push(SPECIAL[key].k==='hidden'?`✨ <b style="color:var(--gold)">히든 조합 발견! ${p.a.type}+${p.b.type} '${SPECIAL[key].n}'</b> (궁합 +${SPECIAL[key].v}%)`:`📖 조합 확인: ${p.a.type}+${p.b.type} '${SPECIAL[key].n}' (${SPECIAL[key].v>0?'+':''}${SPECIAL[key].v}%)`)}
    }
  }
  for(const m of idle){
    let d=m.type[0]==='I'?-30:-15;
    if(QUIRKS[m.quirk].k==='home')d*=1.5;
    addStress(m,d,true);
  }
  // 퇴사
  for(const m of S.staff.slice()){
    if(m.boss||m.stress<100)continue;
    const st=m.storeId?storeById(m.storeId):null;
    if(st&&has(teamOf(st),'ISFJ')&&!m.savedOnce&&m.type!=='ISFJ'){m.savedOnce=true;m.stress=80;msgs.push(`🍱 ISFJ의 도시락: ${m.name}이(가) 그만두려다 마음을 돌렸다`);continue}
    quit(m);
    msgs.push(`🚪 <span class="dn">${m.name}(${m.type})${m.type[0]==='E'?' 돌발 퇴사! "더는 못 하겠어요!"':' 잠수… 연락이 끊겼다.'}</span>`);
  }
  if(S.cash<0)msgs.push('<span class="dn">⚠️ 현금이 마이너스예요! 인건비·임대료를 점검하세요.</span>');

  S.stats.days++;
  S.day++;
  // 주간 처리
  let weekly='';
  if(weekday(S.day)===0){
    rollCandidates();
    const rv=R(RIVALS),dkeys=Object.keys(DISTRICTS);
    const myD=S.stores.map(s=>s.district);
    const d=Math.random()<.6&&myD.length?R(myD):R(dkeys);
    S.news={...rv,district:d,until:S.day+6};
    weekly=`<div class="notes">📅 <b>새로운 한 주</b> — 채용 후보 3명 도착!<br>📰 ${rv.n}(${rv.t})이(가) ${DISTRICTS[d].n}에서 ${rv.a}.</div>`;
  }
  rollNextEvents();
  const infj=S.staff.some(s=>s.type==='INFJ');
  let forecast='';
  if(infj&&S.nextEvents.length){forecast=`<div class="notes">🔮 <b>INFJ 예지몽</b> — 내일: ${S.nextEvents.map(x=>{const e=EVENTS.find(v=>v.id===x.id);return e.e+' '+e.t}).join(', ')}</div>`}

  save();
  modalLock=false;
  openModal(`<div class="small muted">${day}일차 · ${WD[weekday(day)]}요일 정산</div><h2 style="margin-bottom:12px">${totProfit>=0?'💰':'📉'} 순이익 <span class="${totProfit>=0?'up':'dn'}">${totProfit>=0?'+':''}${fmt(totProfit)}</span></h2>
    ${rows.map(({st,r,cogs,wages,rent,profit,fx})=>`<div class="settle-store"><div class="between"><b>${KINDS[st.kind].e} ${KINDS[st.kind].n}</b><b class="${profit>=0?'up':'dn'}">${profit>=0?'+':''}${fmt(profit)}</b></div>
      <table class="tbl"><tr><td>매출 ${r.team.length?`<span class="muted small">(효율 ${Math.round(r.eff*100)}% · 궁합 ${r.comp>0?'+':''}${r.comp}%${fx.rev!==1?` · 이벤트 ×${fx.rev.toFixed(2)}`:''})</span>`:'<span class="dn small">직원 없음</span>'}</td><td>${fmt(r.rev)}</td></tr>
      <tr><td>원가</td><td>-${fmt(cogs)}</td></tr><tr><td>인건비</td><td>-${fmt(wages)}</td></tr><tr><td>임대료</td><td>-${fmt(rent)}</td></tr>${fx.cash?`<tr><td>이벤트</td><td>${fx.cash>0?'+':''}${fmt(fx.cash)}</td></tr>`:''}</table>
      ${r.notes.length?`<div class="small muted" style="margin-top:6px">${r.notes.join('<br>')}</div>`:''}</div>`).join('')}
    ${idleW?`<div class="between small" style="margin:0 2px 10px"><span class="muted">휴무 직원 급여</span><span>-${fmt(idleW)}</span></div>`:''}
    ${msgs.length?`<div class="notes">${msgs.join('<br>')}</div>`:''}
    ${weekly}${forecast}
    <button class="btn primary" id="nextDay">다음 날로</button>`);
  $('nextDay').onclick=()=>{closeModal();render();checkChapter()};
}
function checkChapter(){
  if(!chapterDone())return;
  const c=CHAPTERS[S.chapter];
  S.chapter++;
  c.unlock.forEach(u=>{if(!S.unlocked.includes(u))S.unlocked.push(u)});
  const nx=CHAPTERS[S.chapter];
  save();render();
  if(!nx){ending();return}
  openModal(`<div class="ev-ic">🎊</div><h2>${c.t} 클리어!</h2><p class="lead">보상: ${c.reward}</p>
    <div class="notes"><b>${nx.t}</b><br>${nx.story}</div><button class="btn primary" onclick="closeModal()">계속</button>`);
}
function ending(){
  const hid=S.found.combos.filter(k=>SPECIAL[k]&&SPECIAL[k].k==='hidden').length;
  openModal(`<div class="ev-ic">🌃</div><h2>네온시티의 주인</h2>
    <p class="lead">${S.day-1}일 만에 포장마차 하나에서 나이트클럽까지. 삼촌이 사라진 이유는… 정식 버전에서 계속됩니다.</p>
    <div class="notes">매장 ${S.stores.length}개 · 직원 ${S.staff.length}명 · 평판 ★${S.rep.toFixed(1)}<br>도감 ${S.found.types.length}/16 · 히든 조합 ${hid}/${HIDDEN_TOTAL}</div>
    <div class="stack"><button class="btn primary" id="endOrg">📸 조직도 카드 보기</button><button class="btn ghost" onclick="closeModal()">계속 운영하기</button></div>`);
  $('endOrg').onclick=orgCard;
}
function orgCard(){
  const boss=S.staff.find(s=>s.boss);
  const top=S.staff.filter(s=>!s.boss).sort((a,b)=>({SSR:4,SR:3,R:2,N:1}[b.grade]-{SSR:4,SR:3,R:2,N:1}[a.grade])||b.lv-a.lv).slice(0,6);
  const person=s=>`<div class="org-p">${avatar(s.type)}<b>${s.type}</b><div class="muted">${esc(s.name)}</div></div>`;
  const hid=S.found.combos.filter(k=>SPECIAL[k]&&SPECIAL[k].k==='hidden');
  openModal(`<div class="orgcard"><div class="o-t">ORGANIZATION CHART</div><h3>${esc(S.company)}</h3>
    <div class="org-row">${boss?person(boss):''}</div>
    <div class="org-row">${top.map(person).join('')}</div>
    <div class="small muted" style="line-height:1.7">${S.day-1}일차 · 매장 ${S.stores.length}개 · ★${S.rep.toFixed(1)}<br>${hid.length?'✨ '+hid.map(k=>SPECIAL[k].n).join(' · '):'아직 히든 조합 없음'}</div>
    <div style="margin-top:12px;font-weight:900;font-size:13px;color:var(--orange)">MBTI 시티 타이쿤</div></div>
    <p class="small muted" style="text-align:center">스크린샷으로 저장해 공유해 보세요</p>
    <button class="btn ghost" onclick="closeModal()">닫기</button>`);
}

/* 시작 */
renderIntro();
</script>
</body>
</html>
