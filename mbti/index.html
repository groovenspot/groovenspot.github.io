<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b0808" />
<title>MBTI 시티 라이프</title>

<style>
:root{
  color-scheme:dark;
  --bg:#0b0808;--bg-2:#141010;--card:#171213;--card-2:#211919;--card-3:#2b2121;
  --line:rgba(255,255,255,.09);--txt:#fbf1ec;--muted:#a99a95;
  --orange:#ff7a1a;--gold:#ffcf7a;--red:#ff3b5c;--green:#43d17a;
  --fire:linear-gradient(105deg,#ff4d00 0%,#ff7a1a 50%,#ffcf7a 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--txt);height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.muted{color:var(--muted)}.small{font-size:12px}
.up{color:#7dffb0}.dn{color:#ff8fa3}
#game{display:flex;flex-direction:column;height:100%;max-width:980px;margin:0 auto}
.hud{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bg-2);border-bottom:1px solid var(--line);flex:none}
.hud .money{font-weight:900;font-size:16px;color:#7dffb0}
.hud .clock{font-weight:800;font-size:14px}
.hud .stars{font-size:13px;color:var(--gold);font-weight:800}
.hud .sp{margin-left:auto;display:flex;gap:4px}
.spb{width:34px;height:30px;border-radius:9px;background:var(--card-2);font-size:12px;font-weight:900;color:var(--muted)}
.spb.on{background:var(--fire);color:#1a0a00}
.stage{position:relative;flex:1;min-height:0;background:radial-gradient(900px 500px at 50% 30%,#2a1812,#0b0808 70%)}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,16,16,.9);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}
.pie{position:absolute;z-index:5;display:flex;flex-direction:column;gap:2px;min-width:150px;background:rgba(20,16,16,.96);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.pie .ph{font-size:11px;color:var(--muted);padding:4px 8px 2px;font-weight:800}
.pie button{text-align:left;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:700}
.pie button:hover,.pie button:active{background:var(--card-3)}
.panel{flex:none;background:var(--bg-2);border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom));height:40vh;overflow:auto}
.roster{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.roster::-webkit-scrollbar{display:none}
.rs{flex:none;width:52px;text-align:center;font-size:10px;font-weight:800;color:var(--muted);position:relative}
.rs .av{margin:0 auto 2px}
.rs.on{color:var(--txt)}
.rs.on .av{box-shadow:0 0 0 2px var(--gold)}
.rs .pb{position:absolute;top:-1px;right:6px;width:10px;height:10px;transform:rotate(45deg);border-radius:2px}
.rs.off{opacity:.35}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--line);flex:none}
.tools{display:flex;gap:6px;margin-top:4px}
.tb{flex:1;min-width:0;padding:10px 2px;white-space:nowrap;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:800}
.tb.on{background:var(--fire);color:#1a0a00;border:0}
.info{margin-top:8px}
.ih{display:flex;gap:10px;align-items:center}
.ih h3{margin:0;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.needs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.need{font-size:10px;text-align:center;color:var(--muted);font-weight:700}
.need .nb{height:6px;border-radius:6px;background:var(--card-3);overflow:hidden;margin-top:3px}
.need .nb span{display:block;height:100%;border-radius:6px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card-2);white-space:nowrap}
.chip.good{background:rgba(67,209,122,.14);color:#7dffb0}
.chip.bad{background:rgba(255,59,92,.14);color:#ff8fa3}
.chip.love{background:rgba(255,105,180,.16);color:#ff9bd0}
.row{display:flex;gap:6px;align-items:center}
.btn{display:block;width:100%;padding:12px;border-radius:12px;font-size:14px;font-weight:800;background:var(--card-2);border:1px solid var(--line)}
.btn.primary{background:var(--fire);color:#1a0a00;border:0}
.btn.sm{display:inline-block;width:auto;padding:7px 11px;font-size:12px;border-radius:9px;flex:none}
.btn[disabled]{opacity:.4}
.doing{font-size:12px;margin-top:6px;color:var(--gold);font-weight:700}
.catalog{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.catalog::-webkit-scrollbar{display:none}
.cat{flex:none;width:78px;padding:8px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:11px;font-weight:700}
.cat .e{font-size:22px;display:block}
.cat.on{border-color:var(--gold);background:#2a1d10}
.cat .p{color:#7dffb0;font-size:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:20px;padding:20px 16px;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 8px;font-size:20px}
.lead{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 12px}
.notes{font-size:13px;line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tcell{padding:9px 2px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:12px;font-weight:800}
.tcell .e{font-size:22px;display:block;margin-bottom:2px}
.tcell.on{border-color:var(--gold);background:#2a1d10}
.field{display:block;width:100%;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;outline:none;-webkit-user-select:text;user-select:text}
.logo{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.05;background:var(--fire);-webkit-background-clip:text;background-clip:text;color:transparent}
.cand{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.cand .mid{flex:1;min-width:0;font-size:12px;line-height:1.5}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:5px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--card-3);border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;z-index:30;max-width:92vw;text-align:center;animation:pop .2s;pointer-events:none}
</style>
</head>

const objAt=(x,y)=>S.objs.find(o=>o.x===x&&o.y===y);
const inB=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const walk=(x,y)=>inB(x,y)&&!objAt(x,y);
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function bfs(from,isGoal,allowGoalBlocked){
  const sx=Math.round(from.x),sy=Math.round(from.y);
  const key=(x,y)=>y*W+x,prev=new Map([[key(sx,sy),null]]);const q=[[sx,sy]];
  if(isGoal(sx,sy))return [];
  while(q.length){const [x,y]=q.shift();
    for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=key(nx,ny);
      if(!inB(nx,ny)||prev.has(k))continue;
      const goal=isGoal(nx,ny),free=walk(nx,ny);
      if(!free&&!(goal&&allowGoalBlocked))continue;
      prev.set(k,[x,y]);
      if(goal){const path=[];let c=[nx,ny];while(c&&!(c[0]===sx&&c[1]===sy)){path.unshift({x:c[0],y:c[1]});c=prev.get(key(c[0],c[1]))}return path}
      q.push([nx,ny]);}}
  return null;
}
const adj=(o,x,y)=>Math.abs(o.x-x)+Math.abs(o.y-y)===1;

/* ════════════════ 기분·능력 ════════════════ */
function mood(s){
  let avg=0;for(const [k] of NEEDS)avg+=s.needs[k];avg/=NEEDS.length;
  let m=avg-50;for(const [k] of NEEDS)if(s.needs[k]<15)m-=10;
  for(const l of s.ml)m+=l.v;
  return clamp(Math.round(m),-100,100);
}
const moodColor=m=>m>25?'#3ddc6a':m>-10?'#ffd23f':'#ff3b5c';
function addML(s,k,mult=1){const d=ML[k];s.ml=s.ml.filter(x=>x.k!==k);s.ml.push({k,n:d.n,v:Math.round(d.v*mult),until:S.min+d.d})}
function say(a,text,ms=2600){a.bubble={text,until:performance.now()+ms}}
const SKILL={order:{E:1.35,I:.85,F:1.1},cook:{S:1.3,J:1.1,N:.9,I:1.1},serve:{E:1.2,P:1.1,I:.9},clean:{J:1.4,P:.7,S:1.1}};
function diversity(){const ws=S.staff.filter(s=>s.present&&s.working&&!s.dark);return new Set(ws.map(s=>s.type).join('').split('')).size===8}
const skill=(s,k)=>prefOf(s.type,SKILL[k])*clamp(1+mood(s)/220,.6,1.35)*(s.stress>=70?.75:1)*(diversity()?1.1:1);

/* ════════════════ 잡 실행기 ════════════════ */
function setJob(s,job){
  releaseJob(s);
  s.job={...job,step:0,t:0};s.path=[];
  startStep(s);
}
function releaseJob(s){
  const j=s.job;if(!j)return;
  s.job=null;s.path=[];
  if(j.task){if(!j.task.done)j.task.claim=null;if(j.task.type==='serve'&&s.carry){j.task.picked=false}}
  s.carry=null;
  if(j.obj&&j.obj.busy===s.id)j.obj.busy=null;
  if(j.partner){const p=staff().find(a=>a.id===j.partner);if(p&&p.job&&p.job.kind==='talkee'&&p.job.partner===s.id)p.job=null}
}
function startStep(s){
  const st=s.job&&s.job.steps[s.job.step];if(!st){s.job=null;return}
  s.job.t=0;
  if(st.go){
    const p=bfs(s,st.go,st.into);
    if(p===null){releaseJob(s);return}
    s.path=p;
  } else {s.path=[];st.start&&st.start()}
}
function nextStep(s){
  const j=s.job;if(!j)return;
  j.step++;
  if(j.step>=j.steps.length){s.job=null;j.done&&j.done();return}
  startStep(s);
}
function runJob(s,dm){
  const st=s.job.steps[s.job.step];
  if(!st){s.job=null;return}
  if(st.go){if(!s.path.length)nextStep(s);return}
  s.job.t+=dm;st.tick&&st.tick(dm);
  if(s.job&&s.job.t>=st.act){st.end&&st.end();if(s.job&&s.job.steps[s.job.step]===st)nextStep(s)}
}

/* 잡 종류 */
function useJob(s,o,actId,byPlayer){
  const a=ACTS[actId],def=OBJ[o.t];
  return {kind:'use',label:a.n,obj:o,byPlayer,
    steps:[
      {go:def.seat?(x,y)=>x===o.x&&y===o.y:(x,y)=>adj(o,x,y),into:!!def.seat},
      {act:a.dur,start:()=>{if(def.place){if(a.line)say(s,a.line);return}if(o.busy&&o.busy!==s.id){say(s,'누가 쓰고 있네…');releaseJob(s);return}o.busy=s.id;s.dir=o.x+o.y>s.x+s.y?1:-1;if(a.line)say(s,a.line)},
       tick:(dm)=>{const p=prefOf(s.type,a.pref);for(const k in a.g)s.needs[k]=clamp(s.needs[k]+a.g[k]*dm*(a.g[k]>0?p:1),0,100)},
       end:()=>{if(!def.place)o.busy=null;if(a.ml)addML(s,a.ml);const p=prefOf(s.type,a.pref);if(p>=1.4)say(s,'이거 완전 내 취향!');else if(p<=.7)say(s,'…이건 좀 별로')}},
    ]};
}
function wanderJob(s){
  const inShop=s.working&&S.min>=OPEN&&S.min<CLOSE;
  let tx,ty,tries=0;do{tx=Math.floor(Math.random()*(inShop?8:W));ty=Math.floor(Math.random()*(inShop?SHOP_H:H));tries++}while(!walk(tx,ty)&&tries<40);
  return {kind:'idle',label:inShop?'가게 둘러보는 중':ty>SHOP_H?'동네 한 바퀴 도는 중':'어슬렁거리는 중',steps:[{go:(x,y)=>x===tx&&y===ty},{act:5+Math.random()*8,start:()=>{if(Math.random()<.35)say(s,R(IDLE_LINES[s.type]))}}]};
}
function leaveJob(s){
  const ex=entry();return {kind:'leave',label:'퇴근 중',steps:[{go:(x,y)=>x===ex.x&&y===ex.y},{act:1,end:()=>{s.present=false}}]};
}
const inside=s=>!!(s.job&&s.job.obj&&OBJ[s.job.obj.t].place&&s.job.step===1&&!s.path.length);
/* 사교 */
function pickSocial(a,b){
  const r=rel(a,b),w=[['chat',3]];
  if(a.type[3]==='P'||a.type[0]==='E')w.push(['joke',2]);
  if(a.type[1]==='N'&&a.type[2]==='T')w.push(['debate',3]);
  if(a.type[2]==='F'&&mood(b)<0)w.push(['comfort',5]);
  if(a.type[2]==='F'||a.type[3]==='J')w.push(['praise',2]);
  if(a.type[3]==='P'&&a.type[0]==='E')w.push(['prank',2]);
  if(r.f>=45&&!r.love)w.push(['flirt',2]);
  let q=Math.random()*w.reduce((x,y)=>x+y[1],0);
  for(const [k,v] of w){q-=v;if(q<=0)return k}
  return 'chat';
}
function socialJob(s,target,kind,byPlayer){
  kind=kind||pickSocial(s,target);
  return {kind:'social',label:`${target.boss?'사장님':target.name}에게 ${SOCIAL[kind].n}`,partner:target.id,byPlayer,
    steps:[
      {go:(x,y)=>Math.abs(x-Math.round(target.x))+Math.abs(y-Math.round(target.y))===1},
      {act:14,start:()=>{
         const tj=target.job;
         if(!target.present||(tj&&(tj.kind==='social'||tj.kind==='talkee'||tj.task||tj.kind==='leave'))){say(s,'…바쁘네');s.job.steps[1].act=1;return}
         if(tj&&tj.obj&&tj.obj.busy===target.id)tj.obj.busy=null;
         target.job={kind:'talkee',label:`${s.boss?'사장님':s.name}와 대화 중`,partner:s.id,steps:[{act:999}],step:0,t:0};target.path=[];
         s.dir=target.x+target.y>s.x+s.y?1:-1;target.dir=-s.dir;s.job.talking=true;
         say(s,SOCIAL[kind].e+' '+R(SLINES[kind]),3000);
       },
       tick:(dm)=>{if(!s.job.talking)return;s.needs.social=clamp(s.needs.social+2.4*dm,0,100);target.needs.social=clamp(target.needs.social+2.4*dm,0,100);
         if(s.type[0]==='I')s.needs.energy=clamp(s.needs.energy-.15*dm,0,100);if(target.type[0]==='I')target.needs.energy=clamp(target.needs.energy-.15*dm,0,100)},
       end:()=>{if(!s.job.talking)return;if(target.job&&target.job.kind==='talkee'&&target.job.partner===s.id){target.job=null;resolveSocial(s,target,kind)}}},
    ]};
}
function nm(s){return s.boss?'사장님':s.name}
function resolveSocial(a,b,kind){
  const r=rel(a,b),c=compat(a.type,b.type),bt=b.type;
  let p=.62+c/60+r.f/300;
  if(kind==='joke')p=.5+(bt[3]==='P'?.2:0)+(bt[0]==='E'?.1:0)-(bt[2]==='T'&&bt[3]==='J'?.2:0)+c/80;
  if(kind==='debate')p=bt[1]==='N'&&bt[2]==='T'?.8:bt[2]==='F'?.35:.5;
  if(kind==='comfort')p=bt[2]==='F'?.88:.55;
  if(kind==='praise')p=.82;
  if(kind==='prank')p=bt[3]==='P'?.7:bt[3]==='J'?.25:.5;
  if(kind==='flirt')p=.25+c/40+(r.f-45)/100;
  const ok=Math.random()<clamp(p,.05,.95);
  const before=relLabel(r)[0];
  if(ok){
    r.f=clamp(r.f+6+Math.max(0,c)/3,-100,100);
    const m={chat:'chat',joke:'laugh',debate:'debate',comfort:'comforted',praise:'praised',prank:'laugh',flirt:'chat'}[kind];
    addML(b,m==='debate'?'chat':m,kind==='praise'&&bt[2]==='F'?1.5:1);addML(a,kind==='debate'?'debate':'chat');
    say(b,R(['❤️','ㅋㅋㅋ 진짜?','고마워!','맞아맞아','😆']));b.stress=clamp(b.stress-(kind==='comfort'||kind==='praise'?10:4),0,100);
    if(kind==='flirt'&&r.f>=60&&!r.love){r.love=true;addML(a,'love');addML(b,'love');say(a,'💕',3500);say(b,'💕',3500);logEv(`💕 ${nm(a)}(${a.type})와 ${nm(b)}(${b.type})가 연인이 되었다!`);addXP(20)}
  } else {
    r.f=clamp(r.f-6+Math.min(0,c)/3,-100,100);
    const harsh=(kind==='debate'&&a.type[2]==='T'&&bt[2]==='F')||(kind==='prank'&&bt[3]==='J')||c<=-15;
    addML(b,harsh?(kind==='prank'?'pranked':'fight'):'awkward');addML(a,harsh?'fight':'awkward');
    say(b,R(harsh?['💢 선 넘네','진짜 짜증 나','그만해']:['…어? 응…','😐','아 네…']));if(harsh){b.stress=clamp(b.stress+7,0,100);a.stress=clamp(a.stress+4,0,100)}
  }
  const after=relLabel(r)[0];

function addTask(t){t.id=seq++;t.claim=null;t.done=false;t.age=0;tasks.push(t)}
function taskJob(s,t){
  t.claim=s.id;

     end:()=>{t.done=true;if(!custs.includes(t.cust))return;
       let q=s.type[1]==='N'?.6+Math.random()*.9:.9+Math.random()*.35;q*=clamp(1+mood(s)/250,.75,1.2)*(s.stress>=70?.85:1);if(s.stress>=70&&Math.random()<.4)say(s,'아 소금을…😵');
       if(q>1.3){addML(s,'perfect');say(s,'완벽해 ✨')}
       stove.ready.push(t.cust.id);addTask({type:'serve',cust:t.cust,q})}}]}}
  if(t.type==='serve'){const c=t.cust;return {kind:'task',task:t,label,steps:[
    {go:(x,y)=>!!stove&&adj(stove,x,y)},

    {go:(x,y)=>adj({x:c.x0,y:c.y0},x,y)},

}

/* ════════════════ 자율 행동 (MBTI가 결정에 반영) ════════════════ */
function decide(s){
  if(s.queue.length){const q=s.queue.shift();
    if(q.kind==='use')setJob(s,useJob(s,q.obj,q.act,true));
    else if(q.kind==='social')setJob(s,socialJob(s,q.target,q.social,true));
    else if(q.kind==='task')setJob(s,taskJob(s,q.task));
    return}
  if(S.min>=END){setJob(s,leaveJob(s));return}
  const m=mood(s);
  const urgent=NEEDS.map(([k])=>k).filter(k=>s.needs[k]<25).sort((a,b)=>s.needs[a]-s.needs[b]);
  const open=S.min>=OPEN&&S.min<END;
  // 1) 일
  if(s.dark&&Math.random()<.3)say(s,'🌑 '+DARK[s.type][0]);
  if(s.working&&open&&!urgent.length&&m>-40&&!s.dark){const t=pickTask(s);if(t){setJob(s,taskJob(s,t));return}}
  if(s.working&&open&&m<=-40&&Math.random()<.3)say(s,'오늘은 진짜 못 하겠어요…');
  // 2) 사교 (E는 자주, I는 가끔)
  const wantSocial=s.needs.social<(s.type[0]==='E'?75:45)&&Math.random()<(s.type[0]==='E'?.5:.22);
  if(wantSocial&&!urgent.includes('hunger')&&!urgent.includes('energy')){
    const others=staff().filter(o=>o!==s&&o.present&&!inside(o)&&(!o.job||['idle','use'].includes(o.job.kind))&&!(o.job&&o.job.byPlayer));
    if(others.length){const t=others.sort((a,b)=>(rel(s,b).f+Math.random()*30)-(rel(s,a).f+Math.random()*30))[0];setJob(s,socialJob(s,t));return}
  }
  // 3) 욕구 (근무 중엔 짧은 것만)
  const best=bestNeedAction(s,s.working&&open&&!urgent.length);
  if(best&&(urgent.length||best.score>.25)){
    setJob(s,useJob(s,best.o,best.a));
    if(urgent.length&&s.working&&open)say(s,R(['잠깐만 쉬어도 될까요?',NEEDS.find(n=>n[0]===urgent[0])[2]+' 급해요!']));
    return}
  setJob(s,wanderJob(s));
}
function pickTask(s){
  let best=null,bs=0;
  for(const t of tasks){if(t.done||t.claim)continue;
    const tx=t.cust?t.cust.x0:t.table?t.table.x:1,ty=t.cust?t.cust.y0:t.table?t.table.y:0;
    const d=Math.abs(tx-s.x)+Math.abs(ty-s.y);
    const sc=prefOf(s.type,SKILL[t.type])*(t.type==='serve'?1.5:1)/(1+d*.12)*(1+t.age/60);
    if(sc>bs){bs=sc;best=t}}
  return best;
}
function bestNeedAction(s,shortOnly){
  let best=null;
  for(const o of S.objs){const def=OBJ[o.t];if(!def.acts||o.busy)continue;
    for(const a of def.acts){const A=ACTS[a];if(shortOnly&&(A.dur>30||def.place))continue;
      let sc=0;for(const k in A.g){if(A.g[k]<=0)continue;const gain=Math.min(100-s.needs[k],A.g[k]*A.dur);sc+=gain/100*Math.pow((100-s.needs[k])/100,1.5)*3*prefOf(s.type,A.pref)}
      sc*=1/(1+(Math.abs(o.x-s.x)+Math.abs(o.y-s.y))*.04)*(.85+Math.random()*.3);
      if(!best||sc>best.score)best={o,a,score:sc}}}
  return best;
}

const CUST_EM=['😀','🙂','😎','🤓','🧐','😋','🥸','👵','👴','🧑‍💼','👩‍🎓','🧔'];

function custLeave(c,angry){

/* ════════════════ 메인 업데이트 ════════════════ */
let ctxTimer=0,custTimer=0,walkTimer=0,summaryShown=false;
function update(dtReal){
  if(!S||speed===0||$('modalBg').classList.contains('on'))return;
  const dm=dtReal*3*speed; // 1초 = 게임 3분 (1배속)
  S.min+=dm;
  for(const s of S.staff){if(!s.present&&S.min>=s.arrive&&S.min<END-30&&!s.done){s.present=true;s.done=true;{const e0=entry();s.x=e0.x;s.y=e0.y}
    if(s.arrive>10*60+5){addML(s,'late');say(s,'헉 늦었다…!')}else say(s,R(['좋은 아침!',MEME[s.type]]))}}
  walkTimer-=dm;if(walkTimer<=0&&S.min>8*60&&S.min<END+30&&walkers.length<7){walkTimer=4+Math.random()*8;const a=entry(),b=ENTRY.filter(e=>e!==a)[Math.floor(Math.random()*2)];
    const w={x:a.x,y:a.y,path:[],dir:1,walkT:0,em:R(CUST_EM),body:R(['#6c757d','#577590','#9c6644','#b56576','#4d908e','#8d6fb0'])};w.path=bfs(w,(x,y)=>x===b.x&&y===b.y)||[];if(w.path.length)walkers.push(w)}
  for(const w of walkers)moveAlong(w,dtReal*.8);walkers=walkers.filter(w=>w.path.length);
  if(S.min>=OPEN&&S.min<CLOSE){custTimer-=dm;if(custTimer<=0){spawnCust();custTimer=S.rush?2+Math.random()*3:(26+Math.random()*22)/((.45+S.rep/5*1.2)*trafficMul())}}
  // 예상 매출 (오픈 직전)
  if(!S.today.pred&&S.min>=10*60+50)predict();
  // 피크타임 러시 (2일차부터)
  if(S.day>=2&&!S.today.rushDone&&S.min>=19*60){S.today.rushDone=true;rushStart();return}
  if(S.rush){S.rush.left-=dtReal;if(S.rush.left<=0){const r=S.rush;S.rush=null;toast(r.auto?'러시 종료 · 자동 처리 완료':`러시 종료! 최대 콤보 ${S.today.maxCombo}`)}}
  if(S.min>=END)custs.filter(c=>c.state!=='leave').forEach(c=>custLeave(c,false));
  for(const c of custs.slice()){moveAlong(c,dtReal);updateCust(c,dm)}
  tasks=tasks.filter(t=>!t.done);tasks.forEach(t=>t.age+=dm);
  for(const s of S.staff){if(!s.present)continue;
    const work=s.working&&S.min>=OPEN&&S.min<CLOSE;
    for(const [k] of NEEDS){let d=DECAY[k];
      if(k==='social')d*=s.type[0]==='E'?1.6:.6;
      if(k==='fun'&&s.type[1]==='N')d*=1.25;
      if(work&&k==='energy')d+=.05;if(work&&k==='hygiene')d+=.02;
      s.needs[k]=clamp(s.needs[k]-d*dm,0,100)}
    s.ml=s.ml.filter(l=>l.until>S.min);
    stressTick(s,dm,work);
    if(s.path.length){moveAlong(s,dtReal);if(!s.path.length&&s.job)nextStep(s);continue}
    if(s.job){runJob(s,dm);continue}
    decide(s);
  }
  ctxTimer-=dm;if(ctxTimer<=0){ctxTimer=30;contextMood()}
  if(S.min>=END)S.staff.forEach(s=>{if(s.present&&(!s.job||s.job.kind!=='leave'))setJob(s,leaveJob(s))});
  if(!summaryShown&&S.min>=END&&((!S.staff.some(s=>s.present)&&!custs.length)||S.min>=END+60)){
    summaryShown=true;S.staff.forEach(s=>{releaseJob(s);s.present=false});custs=[];daySummary()}
}
function stressTick(s,dm,work){
  const m=mood(s),resting=s.job&&s.job.kind==='use';
  const ds=(work&&!resting&&!s.dark?.045:-.03)+(m<0?-m*.0009:0)-(m>30?.02:0)-(resting?.05:0)+(S.rush&&work?.08:0);
  const before=s.stress;s.stress=clamp(s.stress+ds*dm,0,100);
  if(s.boss){s.stress=Math.min(s.stress,85);return}
  if(before<70&&s.stress>=70){say(s,'요즘 좀 힘드네요…');if(!S.taught.stress)setTimeout(()=>teach('stress'),50)}
  if(s.stress>=90&&!s.dark&&!S.today.darkStarted){s.dark=S.day;S.today.darkStarted=true;say(s,'🌑 '+DARK[s.type][0],4000);logEv(`🌑 ${nm(s)}(${s.type}) 흑화! ${DARK[s.type][0]}`)}
  if(s.dark&&s.stress<70){s.dark=0;say(s,'…좀 나아졌어요');logEv(`🌤 ${nm(s)}(${s.type}) 흑화에서 돌아옴`)}
}
function predict(){
  const ws=S.staff.filter(s=>s.present&&s.working);
  const spawn=660/(37/((.45+S.rep/5*1.2)*trafficMul())),cap=ws.length*7.5,seats=freeSeats().length*8;
  let pairs=0,n=0;for(let i=0;i<ws.length;i++)for(let j=i+1;j<ws.length;j++){pairs+=compat(ws[i].type,ws[j].type);n++}
  const est=Math.min(spawn,cap,seats)*14000*(1+(n?pairs/n:0)/100)*(diversity()?1.1:1);
  S.today.pred=[Math.round(est*.8/10000)*10000,Math.round(est*1.15/10000)*10000];
  toast(`📈 오늘 예상 매출 ${won(S.today.pred[0])} ~ ${won(S.today.pred[1])}`);
}

function teachHead(t){return `<div class="row" style="gap:10px;margin-bottom:10px">${avatar(t.type,44)}<div><b>${esc(nm(t))}</b> ${typeBadge(t.type)}<div class="small muted">${T[t.type].nick}의 설명</div></div></div>`}
function tone(t,key){

function custAt(sx,sy){
  let best=null,bd=1e9;

  return best;
}

function reachableOK(){
  const seen=new Set([DOOR.y*W+DOOR.x]),q=[[DOOR.x,DOOR.y]];
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(walk(nx,ny)&&!seen.has(ny*W+nx)){seen.add(ny*W+nx);q.push([nx,ny])}}}

}

      <tr><td>오늘 매출</td><td>${won(t.revenue)} (팁 ${won(t.tips)})</td></tr><tr><td>평판</td><td>${'★'.repeat(Math.round(S.rep))}${'☆'.repeat(5-Math.round(S.rep))} ${S.rep.toFixed(2)}</td></tr>
      <tr><td>요청 응대</td><td><span class="up">맞춤 ${t.match}</span> · <span class="dn">어긋남 ${t.miss}</span></td></tr>
      <tr><td>예상 매출</td><td>${t.pred?won(t.pred[0])+' ~ '+won(t.pred[1]):'오픈 전 계산'}</td></tr>
      <tr><td>다양성 보너스</td><td>${diversity()?'<span class="up">E/I·S/N·T/F·J/P 모두 근무 중 → 효율 +10%</span>':'<span class="muted">8글자가 모두 근무하면 +10%</span>'}</td></tr>
      ${S.debt>0?`<tr><td>사채 잔액</td><td class="dn">${won(S.debt)}</td></tr>`:''}
      <tr><td>밀린 업무</td><td>${tasks.filter(x=>!x.done).length}건</td></tr></table>
      <div class="small muted" style="margin:10px 0 4px">🪪 단골 카드 (5회 이상 방문)</div>
      <div class="chips" style="margin-top:0">${S.regs.filter(r=>r.visits>=5).map(r=>`<span class="chip">${r.em} ${esc(r.name)} ${r.type} · ${r.visits}회 · 호감 ${r.aff}</span>`).join('')||'<span class="small muted">아직 없음 · 단골 후보 '+S.regs.length+'명</span>'}</div>
      ${S.alumni.length?`<div class="small muted" style="margin:10px 0 4px">🖼 로비 액자 — 함께했던 사람들</div><div class="chips" style="margin-top:0">${S.alumni.map(a=>`<span class="chip">${T[a.type].em} ${esc(a.name)} ${a.type} · ${a.days}일</span>`).join('')}</div>`:''}
      ${S.titles.length?`<div class="chips">${S.titles.map(x=>`<span class="chip good">🏅 ${x}</span>`).join('')}</div>`:''}
      <div class="small muted" style="margin:12px 0 4px">오늘의 사건</div>
      <div class="notes">${t.events.length?t.events.slice(-8).map(esc).join('<br>'):'아직 없음'}</div>
      <div class="notes" style="margin-top:12px">🎟 <b>파티맵 등급 연동</b> <span class="muted">(준비 중)</span><br><span class="small muted">지금 레벨은 이 기기에만 저장돼요. 파티맵 REGULAR·VIP 등급이나 뱃지로 이어지려면 파티맵 쪽 제휴 API와 게임 계정 서버가 필요해요.</span></div>
      <button class="btn" data-reset style="color:var(--muted)">처음부터 다시 하기</button>`;
  }
  $('info').innerHTML=h;
  const wb=document.querySelector('[data-work]');if(wb)wb.onclick=()=>{const s=S.staff.find(x=>x.id===sel);s.working=!s.working;releaseJob(s);say(s,s.working?'일하러 갑니다!':'쉬어도 돼요? 야호!');renderPanel()};
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{buildPick=b.dataset.b;renderPanel()});
  document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const k=b.dataset.menu;if(!menuOK(k))return;
    if(S.menu.includes(k)){const left=S.menu.filter(x=>x!==k);if(!left.some(x=>!MENU[x].drink))return toast('음식 메뉴가 하나는 있어야 해요');S.menu=left}
    else{if(S.menu.length>=7)return toast('메뉴는 7개까지예요');S.menu.push(k)}renderPanel()});
  const rn=document.querySelector('[data-rename]');if(rn)rn.onclick=()=>{const v=$('rename').value.trim();if(!v)return toast('이름을 입력하세요');S.company=v;save();toast(`간판을 "${v}"(으)로 바꿨어요`);renderPanel()};
  document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const k=b.dataset.move;if(k===S.area)return;
    askYes(`${AREAS[k].city} ${AREAS[k].n}(으)로 이전할까요?`,'₩300,000 내고 이전',()=>{if(S.money<300000)return toast('돈이 부족해요');S.money-=300000;S.moveTo=k;toast(`내일 아침 ${AREAS[k].n}에서 문을 열어요`);renderPanel()})});
  document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>hire(+b.dataset.hire));
  document.querySelectorAll('[data-fire]').forEach(b=>b.onclick=()=>{const s=S.staff.find(x=>x.id===+b.dataset.fire);askYes(`${esc(s.name)}(${s.type})을(를) 해고할까요?`,'해고하기',()=>{releaseJob(s);S.staff=S.staff.filter(x=>x!==s);if(sel===s.id)sel=S.staff[0].id;toast(`${s.name}: "${s.type[2]==='F'?'그동안 감사했어요…ㅠ':'네, 알겠습니다.'}"`);renderPanel()});});
  const rb=document.querySelector('[data-reroll]');if(rb)rb.onclick=()=>{if(S.money<20000)return toast('돈이 부족해요');S.money-=20000;S.cands=rollCands();renderPanel()};
  const rs=document.querySelector('[data-reset]');if(rs)rs.onclick=()=>{askYes('저장된 게임을 지우고 처음부터 할까요?','처음부터 하기',()=>{try{localStorage.removeItem(SAVE_KEY)}catch(e){}closeModal();S=null;custs=[];tasks=[];intro()})};
}
function rollCands(){const have=new Set(S.staff.map(s=>s.type));return TYPES.filter(t=>!have.has(t)).sort(()=>Math.random()-.5).slice(0,3).map(t=>newSim(t))}
function hire(i){
  if(S.staff.length>=8)return toast('직원은 최대 8명까지예요');
  if(S.money<60000)return toast('돈이 부족해요');
  const c=S.cands[i];S.money-=60000;S.cands.splice(i,1);
  {const e0=entry();c.x=e0.x;c.y=e0.y}c.arrive=S.min;c.done=false;S.staff.push(c);
  logEv(`📇 ${c.name}(${c.type}) 입사`);sel=c.id;tool='live';renderPanel();
}
function hud(){
  if(!S)return;
  $('hMoney').textContent=won(S.money);
  const m=Math.floor(S.min),hh=Math.floor(m/60)%24,mm=m%60;
  $('hClock').textContent=`${dlabel(dateOf())} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  $('hStars').textContent=`Lv.${S.lv||1} ★${S.rep.toFixed(1)}`;
  const open=S.min>=OPEN&&S.min<CLOSE;
  const evN=eventsOn(dateOf()).filter(e=>e.areas==='*'||e.areas[S.area]).map(e=>e.n)[0];
  $('banner').textContent=S.rush?`🔥 피크타임 러시 ${Math.ceil(S.rush.left)}초 · ${S.rush.auto?'자동 처리':'콤보 '+S.rush.combo}`:S.min<OPEN?`🌅 출근 시간 · 11:00 오픈`:open?`${evN?'📅 '+evN+' · ':'🏮 '}손님 ${custs.filter(c=>c.state!=='leave').length}명 · 밀린 업무 ${tasks.filter(t=>!t.done).length}`:S.min<END?'🌙 마감 · 남은 손님 응대 중':'🌃 퇴근 중…';
}

/* ════════════════ 하루 정산 ════════════════ */
function daySummary(){
  const t=S.today,wages=S.staff.filter(s=>!s.boss).length*60000,rent=Math.round(50000*area().rent/1000)*1000;
  const debtPay=Math.min(S.debt,100000);S.debt-=debtPay;
  S.money-=wages+rent+debtPay;
  // 흑화 여파
  const darkNotes=[];
  for(const s of S.staff.filter(x=>x.dark)){const k=DARK[s.type][1];
    if(k==='cash'){S.money-=30000;darkNotes.push(`🌑 ${nm(s)}: ${DARK[s.type][0]} -₩30,000`)}
    if(k==='team'){S.staff.forEach(o=>o!==s&&(o.stress=clamp(o.stress+10,0,100)));darkNotes.push(`🌑 ${nm(s)}: ${DARK[s.type][0]} (동료 스트레스 +10)`)}
    if(k==='rep'){S.rep=clamp(S.rep-.1,0,5);darkNotes.push(`🌑 ${nm(s)}: ${DARK[s.type][0]} (평판 -0.1)`)}}
  const net=t.revenue-wages-rent;
  // 예측 vs 실제
  let verdict='';
  if(t.pred){const [lo,hi]=t.pred;
    const why=[];if(t.angry)why.push(`화나서 떠난 손님 ${t.angry}명`);if(t.miss>t.match)why.push(`요청 어긋남 ${t.miss}건 (맞춤 ${t.match})`);
    const tired=S.staff.filter(x=>x.stress>=70);if(tired.length)why.push(`지친 직원: ${tired.map(x=>nm(x)+'('+x.type+')').join(', ')}`);
    const fights=[];for(let i=0;i<S.staff.length;i++)for(let j=i+1;j<S.staff.length;j++){const r=rel(S.staff[i],S.staff[j]);if(r.f<=-20)fights.push(`${nm(S.staff[i])}↔${nm(S.staff[j])}`)}
    if(fights.length)why.push(`사이 나쁜 조합: ${fights.join(', ')}`);
    const good=[];if(t.match)good.push(`요청 맞춤 ${t.match}건`);if(t.maxCombo)good.push(`러시 최대 콤보 ${t.maxCombo}`);if(diversity())good.push('다양성 보너스');
    verdict=t.revenue>hi?`<div class="notes">🎯 <b class="up">대박!</b> 예상 ${won(lo)}~${won(hi)}를 넘었어요.${good.length?'<br>'+good.join(' · '):''}</div>`
      :t.revenue>=lo?`<div class="notes">🎯 <b>적중!</b> 예상 범위 ${won(lo)}~${won(hi)} 안이에요.</div>`
      :`<div class="notes">🔍 <b class="dn">분석</b> — 예상 ${won(lo)}~${won(hi)}보다 낮았어요.<br>${why.length?why.join('<br>'):'손님이 적었던 하루예요.'}</div>`}
  // 이별
  const leaving=S.staff.filter(x=>!x.boss&&(x.stress>=100||(x.dark&&S.day-x.dark>=3)));
  const fare=leaving.map(x=>{const days=S.day-x.hired+1;const best=S.staff.filter(o=>o!==x).sort((a,b)=>rel(x,b).f-rel(x,a).f)[0];
    S.alumni.push({name:x.name,type:x.type,days});
    return `<div class="notes" style="text-align:center"><div style="font-size:34px">${T[x.type].em}</div><b>${esc(x.name)} (${x.type})</b>가 떠납니다<br><span class="muted">함께한 ${days}일 · 서빙 ${x.served}번${best?` · 가장 친했던 ${esc(nm(best))}`:''}</span><br>"${x.type[2]==='F'?'그동안 정말 고마웠어요… 잊지 않을게요.':'여기까지인 것 같아요. 감사했습니다.'}"<br><span class="muted small">🖼 로비 액자에 사진이 걸렸어요</span></div>`}).join('');
  if(leaving.length){S.staff=S.staff.filter(x=>!leaving.includes(x));if(!S.staff.some(x=>x.id===sel))sel=S.staff[0].id}
  // 파산 위기
  S.negDays=S.money<0?S.negDays+1:0;
  let crisis='';
  if(S.negDays>=5)crisis=`<div class="notes dn">💥 <b>파산</b> — 5일 연속 적자. 내일 아침 첫 가게로 돌아가 다시 시작해요. 사장과 친한 직원만 따라와요.</div>`;
  else if(S.negDays>=3)crisis=`<div class="notes dn">⚠️ <b>파산 위기</b> — ${S.negDays}일째 마이너스예요. 가구를 팔거나 사채를 써서 버텨 보세요.</div>${S.debt?'':'<button class="btn" id="loan" style="margin-bottom:8px">💸 사채 ₩500,000 받기 (하루 ₩100,000씩 6일 상환)</button>'}`;
  if(S.bankrupt&&S.money>=1000000&&!S.titles.includes('불사조 대표')){S.titles.push('불사조 대표');crisis+=`<div class="notes up">🔥 <b>불사조 대표</b> 칭호! 파산을 딛고 재기했어요.</div>`}
  const sorted=S.staff.slice().sort((a,b)=>mood(b)-mood(a)),best=sorted[0],worst=S.staff.slice().sort((a,b)=>b.stress-a.stress)[0];
  openModal(`<div class="small muted">${S.day}일차 마감</div><h2>${net>=0?'💰':'📉'} 순이익 <span class="${net>=0?'up':'dn'}">${won(net)}</span></h2>
    ${verdict}
    <table class="tbl"><tr><td>손님 응대</td><td>${t.served}명 · 요청 맞춤 ${t.match}/${t.match+t.miss}</td></tr><tr><td>화나서 떠난 손님</td><td class="dn">${t.angry}명</td></tr>
    <tr><td>매출 (팁 포함)</td><td>${won(t.revenue)}</td></tr><tr><td>급여</td><td>-${won(wages)}</td></tr><tr><td>임대료</td><td>-${won(rent)}</td></tr>${debtPay?`<tr><td>사채 상환</td><td>-${won(debtPay)}</td></tr>`:''}</table>
    <div class="notes" style="margin-top:10px">😊 오늘의 기분왕: <b>${esc(nm(best))}</b>(${best.type})<br>😣 스트레스 최고: <b>${esc(nm(worst))}</b>(${worst.type}) ${Math.round(worst.stress)}${darkNotes.length?'<br>'+darkNotes.join('<br>'):''}${t.events.length?'<br><br>'+t.events.slice(-6).map(esc).join('<br>'):''}</div>
    ${fare}${crisis}
    <button class="btn primary" id="nextDay">다음 날 아침으로 ☀️</button>`);
  const ln=$('loan');if(ln)ln.onclick=()=>{S.money+=500000;S.debt=600000;ln.remove();toast('사채 ₩500,000 입금… 갚을 땐 ₩600,000')};
  $('nextDay').onclick=()=>{
    addXP(30);S.day++;S.cands=null;
    if(S.negDays>=5)bankrupt();
    // 집에서 보낸 밤: 유형마다 회복이 다르다 (E는 사람이 그립고, I는 충전 완료)
    for(const s of S.staff){s.needs.hunger=Math.max(s.needs.hunger,80);s.needs.energy=s.needs.energy<20?70:Math.max(s.needs.energy,90);s.needs.hygiene=95;
      s.needs.fun=clamp(s.needs.fun+25,0,100);s.needs.social=s.type[0]==='E'?Math.min(s.needs.social,55):clamp(s.needs.social+30,0,85);s.done=false;
      s.stress=clamp(s.stress-(s.type[0]==='I'?32:22),0,100)}
    resetDay();closeModal();save();renderPanel();
  };
}
function bankrupt(){
  const boss=S.staff.find(s=>s.boss);
  const stay=S.staff.filter(s=>s.boss||rel(boss,s).f>=20);
  const gone=S.staff.filter(s=>!stay.includes(s));
  gone.forEach(g=>S.alumni.push({name:g.name,type:g.type,days:S.day-g.hired}));
  S.staff=stay;S.objs=defaultLayout().filter(o=>['wall','stove','fridge','table','chair','sofa'].includes(o.t)&&!(o.t==='table'&&o.x===6)&&!(o.t==='chair'&&o.x===6));
  S.money=200000;S.debt=0;S.negDays=0;S.bankrupt=true;S.rep=Math.max(1.5,S.rep-.5);
  setTimeout(()=>openModal(`<div style="font-size:44px">🏮</div><h2>다시, 그 골목</h2><p class="lead">가게를 정리하고 첫 포장마차로 돌아왔다. 끝까지 남아 준 사람은 ${stay.length-1}명.${gone.length?`<br><span class="muted">떠난 사람: ${gone.map(g=>esc(g.name)+'('+g.type+')').join(', ')}</span>`:''}</p><div class="notes">누가 남았는지가 그동안의 경영 성적표예요. ₩1,000,000을 다시 모으면 <b>불사조 대표</b> 칭호!</div><button class="btn primary" onclick="closeModal()">다시 시작</button>`),60);
}

/* ════════════════ 공용 ════════════════ */
function askYes(q,yes,fn){openModal(`<h2>${q}</h2><div class="row" style="margin-top:14px"><button class="btn" id="ayN">취소</button><button class="btn primary" id="ayY">${yes}</button></div>`);$('ayN').onclick=closeModal;$('ayY').onclick=()=>{closeModal();fn()}}
function openModal(h){$('modal').innerHTML=h;$('modalBg').classList.add('on')}
function closeModal(){$('modalBg').classList.remove('on')}
function toast(m){const el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
let last=performance.now(),pTimer=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  try{update(dt);draw()}catch(e){console.error(e)}
  pTimer-=dt;if(pTimer<=0){pTimer=.5;hud();if((tool==='live'||(tool==='shop'&&document.activeElement?.id!=='rename'))&&!panelHold){const sc=$('panel').scrollTop;renderPanel();$('panel').scrollTop=sc}}
  requestAnimationFrame(frame);
}
resize();intro();requestAnimationFrame(frame);
</script>
</body>
</html>
