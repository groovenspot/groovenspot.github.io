  addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
  var cvs = renderer.domElement;
  cvs.addEventListener('pointerdown', function (e) { if (look.id !== null) return; look.id = e.pointerId; look.x = e.clientX; look.y = e.clientY; cvs.setPointerCapture(e.pointerId); if (e.pointerType === 'touch') document.body.classList.add('touch'); });
  cvs.addEventListener('pointermove', function (e) { if (e.pointerId !== look.id) return; var k = e.pointerType === 'touch' ? .006 : .0042; player.yaw -= (e.clientX - look.x) * k; player.pitch = Math.max(-.9, Math.min(.7, player.pitch - (e.clientY - look.y) * k)); look.x = e.clientX; look.y = e.clientY; hideHint(); });
  function endLook(e) { if (e.pointerId === look.id) look.id = null; }
  cvs.addEventListener('pointerup', endLook); cvs.addEventListener('pointercancel', endLook);
  var joyEl = $('#joy'), knob = joyEl.querySelector('i');
  joyEl.addEventListener('pointerdown', function (e) { joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); moveJoy(e); });
  joyEl.addEventListener('pointermove', function (e) { if (e.pointerId === joy.id) moveJoy(e); });
  function moveJoy(e) { var r = joyEl.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy), m = r.width / 2 - 10; if (d > m) { dx *= m / d; dy *= m / d; } joy.x = dx / m; joy.y = dy / m; knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; hideHint(); }
  function endJoy(e) { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; }
  joyEl.addEventListener('pointerup', endJoy); joyEl.addEventListener('pointercancel', endJoy);
  if (matchMedia('(pointer: coarse)').matches) { document.body.classList.add('touch'); $('#hint').textContent = '화면을 끌어 둘러보고 · 왼쪽 조이스틱으로 걸어요'; }
  var hinted = false; function hideHint() { if (hinted) return; hinted = true; setTimeout(function () { $('#hint').style.opacity = 0; }, 2500); }

  document.querySelectorAll('[data-floor]').forEach(function (b) { b.addEventListener('click', function () { setFloor(b.dataset.floor); }); });
  $('#sound').addEventListener('click', function () {
    soundWanted = !soundWanted; this.textContent = soundWanted ? '🔊' : '🔇'; this.setAttribute('aria-pressed', soundWanted ? 'true' : 'false');
    if (soundWanted) startAudio(); else if (AC) master.gain.setTargetAtTime(.0001, AC.currentTime, .2);
  });
  var handsUntil = 0;
  $('#hands').addEventListener('click', function () { handsUntil = clock() + 4; toast('🙌 HANDS UP!', FLOORS[active].css); });
  $('#bottle').addEventListener('click', function () {
    var rec = floors[active], best = null, bd = 1e9;
    rec.tables.forEach(function (p) { var d = Math.hypot(p.x - player.x, p.z - player.z); if (d < bd) { bd = d; best = p; } });
    rec.sparks.emit.push({ p: best, until: clock() + 6 });
    toast('🍾 바틀 서비스!', '#ffd27a');
    // 테이블 쪽으로 고개 돌리기
    player.yaw = Math.atan2(-(best.x - player.x), -(best.z - player.z));
  });
  $('#enter').addEventListener('click', function () { soundWanted = true; startAudio(); $('#gate').hidden = true; toast(FLOORS[active].name, FLOORS[active].css); });
  $('#enter-quiet').addEventListener('click', function () { soundWanted = false; $('#sound').textContent = '🔇'; $('#sound').setAttribute('aria-pressed', 'false'); $('#gate').hidden = true; });

  /* ---------------- 이동 · 충돌 ---------------- */
  function blocked(x, z) {
    var m = .35, rec = floors[active];
    if (x < -W / 2 + m || x > W / 2 - m || z < -D / 2 + m || z > D / 2 - m) return true;
    for (var i = 0; i < rec.colliders.length; i++) { var c = rec.colliders[i]; if (c[4] === 'crowd') continue; if (x > c[0] - m && x < c[2] + m && z > c[1] - m && z < c[3] + m) return true; }
    return false;
  }
  function move(dt) {
    var f = 0, s = 0;
    if (keys.w || keys.arrowup) f += 1; if (keys.s || keys.arrowdown) f -= 1;
    if (keys.a || keys.arrowleft) s -= 1; if (keys.d || keys.arrowright) s += 1;
    if (keys.q) player.yaw += dt * 1.6; if (keys.e) player.yaw -= dt * 1.6;
    f -= joy.y; s += joy.x;
    var len = Math.hypot(f, s); if (len > 1) { f /= len; s /= len; }
    if (!len) return false;
    var sp = 3.2 * dt, sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
    var dx = (-sy * f + cy * s) * sp, dz = (-cy * f - sy * s) * sp;
    // 관객 사이는 천천히
    var crowdZone = player.x > -9.8 && player.x < 9.8 && player.z > -6.6 && player.z < 2.3;
    if (crowdZone) { dx *= .55; dz *= .55; }
    if (!blocked(player.x + dx, player.z)) player.x += dx;
    if (!blocked(player.x, player.z + dz)) player.z += dz;
    var st = floors[active].stairs; if (Math.hypot(player.x - st.x, player.z - st.z) < .9) setFloor(active === '2F' ? '3F' : '2F');
    return true;
  }

  /* ---------------- 애니메이션 ---------------- */
  var m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(1, 1, 1), eu = new THREE.Euler(), last = performance.now(), frame = 0;
  function beatInfo(t) {
    var spb = 60 / FLOORS[active].bpm, ph = ((t - startT) / spb) % 1; if (ph < 0) ph += 1;
    var hit = 0; for (var i = hits.length - 1; i >= 0; i--) { var dtt = t - hits[i][0]; if (dtt >= 0 && dtt < .35) { hit = Math.max(hit, hits[i][1] * (1 - dtt / .35)); } }
    if (!audioOn) hit = Math.pow(1 - ph, 3);
    return { ph: ph, hit: hit };
  }
  function tick() {
    requestAnimationFrame(tick);
    var now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now; frame++;
    var t = clock(), rec = floors[active], b = beatInfo(t), e = active === '3F' ? (audioOn ? energy : 1) : 1, hit = b.hit * (.4 + .6 * e);
    var dropping = dropT > 0 && t - dropT >= 0 && t - dropT < 1.2;
    var walking = move(dt);

    // 카메라 (걸을 때 살짝 흔들림, 비트에 아주 약한 진동)
    var bob = walking ? Math.sin(now / 140) * .025 : 0;
    camera.position.set(player.x, player.y + bob, player.z);
    eu.set(player.pitch, player.yaw, 0, 'YXZ'); camera.quaternion.setFromEuler(eu);
    camera.position.y += hit * .012;

    // 무빙헤드 · 랜턴 · 턴테이블 등
    rec.movers.forEach(function (o) {
      if (o.type === 'head') { o.m.rotation.z = Math.sin(t * (.6 + o.i * .07) + o.i) * .7; o.m.rotation.x = Math.cos(t * (.5 + o.i * .05) + o.i * 2) * .5; o.cone.material.opacity = .05 + hit * .12 * (o.i % 2 ? 1 : .8) + (dropping ? .1 : 0); }
      else if (o.type === 'lantern') { o.m.rotation.y = t * .3 + o.ph; o.m.position.x += Math.sin(t * .8 + o.ph) * .0006; }
      else if (o.type === 'spin') o.m.rotation.y = t * 3.5;
      else if (o.type === 'strip') o.m.material.opacity = .35 + hit * .65;
      else if (o.type === 'cone') o.m.scale.setScalar(1 + hit * .08);
    });
    rec.lights.forEach(function (L, i) { L.intensity = .35 + hit * (i === 1 ? 2.4 : 1.8) + (dropping ? 1.5 : 0); });
    if (rec.laserGroup) {
      var la = e > .45 ? 1 : .15; rec.laserGroup.rotation.y = Math.sin(t * .9) * .5;
      rec.lasers.forEach(function (o) { var a = (o.i - 6.5) * .085 + Math.sin(t * 1.3 + o.i) * .05; o.m.rotation.set(Math.PI / 2 + .12 + Math.sin(t * .7 + o.i * .3) * .1, 0, a); o.m.material.opacity = (dropping ? .9 : .55) * la * (.5 + hit * .5); });
    }
    // DJ
    rec.dj.position.y = Math.abs(Math.sin(b.ph * Math.PI)) * .05;
    rec.dj.rotation.y = Math.sin(t * .7) * .2;
    rec.djArm.rotation.z = (dropping || t < handsUntil) ? -2.6 + Math.sin(t * 8) * .2 : -.2 - hit * .5;
    // 관객
    var C = rec.crowd, up = t < handsUntil || dropping;
    C.people.forEach(function (p, i) {
      var j = Math.abs(Math.sin((b.ph + p.ph / 6.28) * Math.PI)) * .12 * p.amp * (.4 + e * .6);
      var yb = .6 * p.h + j;
      q.setFromAxisAngle(v3.set(0, 1, 0), p.rot + Math.sin(t * .8 + p.ph) * .15);
      m4.compose(v3.set(p.x, yb, p.z), q, s3.set(1, p.h, 1)); C.body.setMatrixAt(i, m4);
      m4.compose(v3.set(p.x, yb + .62 * p.h, p.z), q, s3.set(1, 1, 1)); C.heads.setMatrixAt(i, m4);
      var hu = up || (p.up && e > .6 && Math.sin(t * .4 + p.ph) > .2);
      for (var k = 0; k < 2; k++) {
        var side = k ? .24 : -.24, hy = hu ? yb + .85 * p.h + Math.sin(t * 6 + p.ph + k) * .05 : -50;
        m4.compose(v3.set(p.x + Math.cos(p.rot) * side, hy, p.z - Math.sin(p.rot) * side), q, s3.set(1, 1, 1)); C.hands.setMatrixAt(i * 2 + k, m4);
      }
    });
    C.body.instanceMatrix.needsUpdate = true; C.heads.instanceMatrix.needsUpdate = true; C.hands.instanceMatrix.needsUpdate = true;
    // 스파클러
    var S = rec.sparks, pos = S.pts.geometry.attributes.position.array, alive = false;
    S.emit = S.emit.filter(function (em) { return em.until > t; });
    if (S.emit.length) { S.light.position.set(S.emit[0].p.x + .3, 2.2, S.emit[0].p.z); S.light.intensity = 1 + Math.random() * .8; } else S.light.intensity = 0;
    for (var i = 0; i < S.n; i++) {
      var v = S.v[i];
      if (v.life <= 0 && S.emit.length && Math.random() < .8) {
        var em = S.emit[i % S.emit.length], bx = em.p.x + (i % 4 - 1.5) * .07;
        pos[i * 3] = bx; pos[i * 3 + 1] = em.p.y + .25; pos[i * 3 + 2] = em.p.z;
        v.vx = (Math.random() - .5) * .7; v.vy = 2.4 + Math.random() * 1.6; v.vz = (Math.random() - .5) * .9; v.life = .5 + Math.random() * .6;
      }
      if (v.life > 0) { alive = true; v.life -= dt; v.vy -= 3.2 * dt; pos[i * 3] += v.vx * dt; pos[i * 3 + 1] += v.vy * dt; pos[i * 3 + 2] += v.vz * dt; if (v.life <= 0) pos[i * 3 + 1] = -99; }
    }
    if (alive || S.emit.length) S.pts.geometry.attributes.position.needsUpdate = true;
    // LED 월은 2프레임마다
    if (frame % 2 === 0) drawLED(active, t, hit, e);
    // 3F 드롭 순간 화면 효과
    if (dropping && t - dropT < .08) toast('DROP!', FLOORS['3F'].css);
    renderer.render(scene, camera);
  }

  addEventListener('resize', function () { renderer.setSize(stage.clientWidth, stage.clientHeight); camera.aspect = stage.clientWidth / stage.clientHeight; camera.updateProjectionMatrix(); });
  document.addEventListener('visibilitychange', function () { if (!AC) return; if (document.hidden) AC.suspend(); else if (audioOn && soundWanted) AC.resume(); });

  setFloor('2F', true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { [ '2F', '3F' ].forEach(function (F) { drawLED(F, 0, .3, 1); }); });
  tick();
})();
</script>
