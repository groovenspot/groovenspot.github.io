    eu.set(player.pitch, player.yaw, 0, 'YXZ'); camera.quaternion.setFromEuler(eu);
    camera.position.y += hit * .012;

    // 무빙헤드 · 랜턴 · 턴테이블 등
    rec.movers.forEach(function (o) {
      if (o.type === 'head') { o.m.rotation.z = Math.sin(t * (.6 + o.i * .07) + o.i) * .7; o.m.rotation.x = Math.cos(t * (.5 + o.i * .05) + o.i * 2) * .5; o.cone.material.opacity = .05 + hit * .12 * (o.i % 2 ? 1 : .8) + (dropping ? .1 : 0); }
      else if (o.type === 'lantern') { o.m.rotation.y = t * .3 + o.ph; o.m.position.x += Math.sin(t * .8 + o.ph) * .0006; }
      else if (o.type === 'spin') o.m.rotation.y = t * 3.5;
      else if (o.type === 'strip') o.m.material.opacity = .35 + hit * .65;
      else if (o.type === 'cone') o.m.scale.setScalar(1 + hit * .08);
    });
    rec.lights.forEach(function (L, i) { L.intensity = .35 + hit * (i === 1 ? 2.4 : 1.8) + (dropping ? 1.5 : 0); });
    if (rec.laserGroup) {
      var la = e > .45 ? 1 : .15; rec.laserGroup.rotation.y = rec.laserYaw + Math.sin(t * .9) * .5;
      rec.lasers.forEach(function (o) { var a = (o.i - 6.5) * .085 + Math.sin(t * 1.3 + o.i) * .05; o.m.rotation.set(Math.PI / 2 + .12 + Math.sin(t * .7 + o.i * .3) * .1, 0, a); o.m.material.opacity = (dropping ? .9 : .55) * la * (.5 + hit * .5); });
    }
    // DJ
    rec.dj.position.y = Math.abs(Math.sin(b.ph * Math.PI)) * .05;
    rec.dj.rotation.y = rec.djYaw + Math.sin(t * .7) * .2;
    rec.djArm.rotation.z = (dropping || t < handsUntil) ? -2.6 + Math.sin(t * 8) * .2 : -.2 - hit * .5;
    // 관객
    var C = rec.crowd, up = t < handsUntil || dropping;
    C.people.forEach(function (p, i) {
      var j = Math.abs(Math.sin((b.ph + p.ph / 6.28) * Math.PI)) * .12 * p.amp * (.4 + e * .6);
      var yb = .6 * p.h + j;
      q.setFromAxisAngle(v3.set(0, 1, 0), p.rot + Math.sin(t * .8 + p.ph) * .15);
      m4.compose(v3.set(p.x, yb, p.z), q, s3.set(1, p.h, 1)); C.body.setMatrixAt(i, m4);
      m4.compose(v3.set(p.x, yb + .62 * p.h, p.z), q, s3.set(1, 1, 1)); C.heads.setMatrixAt(i, m4);
      var hu = up || (p.up && e > .6 && Math.sin(t * .4 + p.ph) > .2);
      for (var k = 0; k < 2; k++) {
        var side = k ? .24 : -.24, hy = hu ? yb + .85 * p.h + Math.sin(t * 6 + p.ph + k) * .05 : -50;
        m4.compose(v3.set(p.x + Math.cos(p.rot) * side, hy, p.z - Math.sin(p.rot) * side), q, s3.set(1, 1, 1)); C.hands.setMatrixAt(i * 2 + k, m4);
      }
    });
    C.body.instanceMatrix.needsUpdate = true; C.heads.instanceMatrix.needsUpdate = true; C.hands.instanceMatrix.needsUpdate = true;
    // 스파클러
    var S = rec.sparks, pos = S.pts.geometry.attributes.position.array, alive = false;
    S.emit = S.emit.filter(function (em) { return em.until > t; });
    if (S.emit.length) { S.light.position.set(S.emit[0].p.x + .3, 2.2, S.emit[0].p.z); S.light.intensity = 1 + Math.random() * .8; } else S.light.intensity = 0;
    for (var i = 0; i < S.n; i++) {
      var v = S.v[i];
      if (v.life <= 0 && S.emit.length && Math.random() < .8) {
        var em = S.emit[i % S.emit.length], bx = em.p.x + (i % 4 - 1.5) * .07;
        pos[i * 3] = bx; pos[i * 3 + 1] = em.p.y + .25; pos[i * 3 + 2] = em.p.z;
        v.vx = (Math.random() - .5) * .7; v.vy = 2.4 + Math.random() * 1.6; v.vz = (Math.random() - .5) * .9; v.life = .5 + Math.random() * .6;
      }
      if (v.life > 0) { alive = true; v.life -= dt; v.vy -= 3.2 * dt; pos[i * 3] += v.vx * dt; pos[i * 3 + 1] += v.vy * dt; pos[i * 3 + 2] += v.vz * dt; if (v.life <= 0) pos[i * 3 + 1] = -99; }
    }
    if (alive || S.emit.length) S.pts.geometry.attributes.position.needsUpdate = true;
    // LED 월은 2프레임마다
    if (frame % 2 === 0) drawLED(active, t, hit, e);
    // 3F 드롭 순간 화면 효과
    if (dropping && t - dropT < .08) toast('DROP!', FLOORS['3F'].css);
    if (TOP) { var asp = stage.clientWidth / stage.clientHeight, hw = Math.max(rec.W / 2 + .6, (rec.D / 2 + 1.6) * asp); ortho.left = -hw; ortho.right = hw; ortho.top = hw / asp; ortho.bottom = -hw / asp; ortho.position.set(0, 20, .4); ortho.up.set(0, 0, -1); ortho.lookAt(0, 0, .4); ortho.updateProjectionMatrix(); }
    renderer.render(scene, TOP ? ortho : camera);
  }

  addEventListener('resize', function () { renderer.setSize(stage.clientWidth, stage.clientHeight); camera.aspect = stage.clientWidth / stage.clientHeight; camera.updateProjectionMatrix(); });
  document.addEventListener('visibilitychange', function () { if (!AC) return; if (document.hidden) AC.suspend(); else if (audioOn && soundWanted) AC.resume(); });

  setFloor('2F', true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { texList.forEach(function (o) { o.ctx.clearRect(0, 0, o.c.width, o.c.height); o.draw(o.ctx, o.c.width, o.c.height); o.tex.needsUpdate = true; }); [ '2F', '3F' ].forEach(function (F) { drawLED(F, 0, .3, 1); }); });
  tick();
})();
</script>
